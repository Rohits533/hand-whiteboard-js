<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🏎️ Hand Racing - Drive with Your Hands!</title>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="Race with hand gestures! Steer with your hands, accelerate, and brake." />
    <link rel="manifest" href="manifest.json" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0a0a1a;
            overflow: hidden;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0a0a1a;
            touch-action: none;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .hud-item .label {
            font-size: 0.6rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-item .value {
            font-size: 1.2rem;
        }

        .hud-item .value.speed {
            color: #4ade80;
        }

        .hud-item .value.score {
            color: #fbbf24;
        }

        .hud-item .value.highscore {
            color: #f472b6;
        }

        /* Speedometer */
        #speedometer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            pointer-events: none;
            z-index: 10;
        }

        #speedometer svg {
            width: 100%;
            height: 100%;
        }

        /* Gesture Indicator */
        #gestureIndicator {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #gestureIndicator.show {
            opacity: 1;
        }

        #gestureIndicator .emoji {
            font-size: 1.4rem;
            margin-right: 8px;
        }

        /* Start Screen */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            padding: 20px;
        }

        #startScreen.hidden {
            display: none;
        }

        #startScreen h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(102, 126, 234, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        #startScreen .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 18px 50px;
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            font-weight: 700;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(102, 126, 234, 0.3);
            pointer-events: all;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(102, 126, 234, 0.5);
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        .gesture-guide {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gesture-guide-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 20px;
            text-align: center;
            color: white;
            min-width: 80px;
        }

        .gesture-guide-item .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 5px;
        }

        .gesture-guide-item .name {
            font-size: 0.7rem;
            opacity: 0.7;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Game Over */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 50;
            padding: 20px;
        }

        #gameOverScreen.show {
            display: flex;
        }

        #gameOverScreen h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: #ef4444;
            margin-bottom: 10px;
        }

        #gameOverScreen .final-score {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: white;
            margin-bottom: 5px;
        }

        #gameOverScreen .final-highscore {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: #f472b6;
            margin-bottom: 30px;
        }

        #gameOverScreen .restart-btn {
            padding: 15px 40px;
            font-size: clamp(1rem, 1.5vw, 1.4rem);
            font-weight: 700;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: all;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
        }

        #gameOverScreen .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.5);
        }

        /* Camera feed for hand tracking */
        #video {
            display: none;
        }

        #landmarkCanvas {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hud-item {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
            .hud-item .value {
                font-size: 1rem;
            }
            #speedometer {
                width: 80px;
                height: 80px;
                bottom: 20px;
            }
            #gestureIndicator {
                bottom: 110px;
                font-size: 0.8rem;
                padding: 6px 16px;
            }
            .gesture-guide-item {
                padding: 10px 15px;
                min-width: 60px;
            }
            .gesture-guide-item .icon {
                font-size: 1.5rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #speedometer {
                width: 60px;
                height: 60px;
                bottom: 10px;
            }
            #gestureIndicator {
                bottom: 80px;
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .hud-item {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
            .hud-item .value {
                font-size: 0.9rem;
            }
        }

        /* PWA install banner */
        #installBanner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 200;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        #installBanner.show {
            display: flex;
        }

        #installBanner p {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        #installBanner button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        #installBanner button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Video for hand tracking -->
        <video id="video" autoplay playsinline></video>
        <canvas id="landmarkCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="hud-item">
                        <div class="label">🏁 Speed</div>
                        <div class="value speed" id="speedDisplay">0</div>
                    </div>
                    <div class="hud-item">
                        <div class="label">⏱️ Distance</div>
                        <div class="value" id="distanceDisplay">0</div>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="hud-item">
                        <div class="label">⭐ Score</div>
                        <div class="value score" id="scoreDisplay">0</div>
                    </div>
                    <div class="hud-item">
                        <div class="label">🏆 Best</div>
                        <div class="value highscore" id="highScoreDisplay">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Speedometer -->
        <div id="speedometer">
            <svg viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
                <circle cx="60" cy="60" r="50" fill="none" stroke="#4ade80" stroke-width="8"
                    stroke-dasharray="314" stroke-dashoffset="314"
                    id="speedArc" transform="rotate(-90 60 60)"/>
                <circle cx="60" cy="60" r="6" fill="#4ade80" id="speedDot"/>
            </svg>
        </div>

        <!-- Gesture Indicator -->
        <div id="gestureIndicator">
            <span class="emoji">🏃</span>
            <span id="gestureText">Driving</span>
        </div>

        <!-- Start Screen -->
        <div id="startScreen">
            <h1>🏎️ HAND RACING</h1>
            <p class="subtitle">Drive with your hands!</p>

            <button class="start-btn" id="startBtn">🚦 Start Race</button>

            <div class="gesture-guide">
                <div class="gesture-guide-item">
                    <span class="icon">🤲</span>
                    <span class="name">Steer</span>
                </div>
                <div class="gesture-guide-item">
                    <span class="icon">🖐️</span>
                    <span class="name">Accelerate</span>
                </div>
                <div class="gesture-guide-item">
                    <span class="icon">✊</span>
                    <span class="name">Brake</span>
                </div>
                <div class="gesture-guide-item">
                    <span class="icon">☝️</span>
                    <span class="name">Boost</span>
                </div>
            </div>
        </div>

        <!-- Game Over -->
        <div id="gameOverScreen">
            <h1>💥 CRASH!</h1>
            <p class="final-score">Score: <span id="finalScore">0</span></p>
            <p class="final-highscore">🏆 Best: <span id="finalHighScore">0</span></p>
            <button class="restart-btn" id="restartBtn">🔄 Race Again</button>
        </div>

        <!-- Install Banner -->
        <div id="installBanner">
            <p>🏎️ Install Hand Racing for the best experience!</p>
            <button id="installBtn">Install</button>
        </div>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous">
    </script>

    <script>
        // ============================================
        // KALMAN FILTER
        // ============================================
        class KalmanFilter {
            constructor(pn = 0.1, mn = 0.5, iv = 0) {
                this.pn = pn;
                this.mn = mn;
                this.est = iv;
                this.err = 1;
                this.kg = 0;
            }
            update(m) {
                const pe = this.est;
                const pec = this.err + this.pn;
                this.kg = pec / (pec + this.mn);
                this.est = pe + this.kg * (m - pe);
                this.err = (1 - this.kg) * pec;
                return this.est;
            }
            reset(v) { this.est = v;
                this.err = 1;
                this.kg = 0; }
        }

        class PosFilter {
            constructor() {
                this.x = new KalmanFilter(0.08, 0.3, 0);
                this.y = new KalmanFilter(0.08, 0.3, 0);
                this.has = false;
            }
            update(rx, ry) {
                if (!this.has) { this.x.reset(rx);
                    this.y.reset(ry);
                    this.has = true; return { x: rx, y: ry }; }
                return { x: this.x.update(rx), y: this.y.update(ry) };
            }
            reset() { this.has = false;
                this.x.reset(0);
                this.y.reset(0); }
        }

        // ============================================
        // GAME STATE
        // ============================================
        const G = {
            // Game
            running: false,
            over: false,
            paused: false,
            score: 0,
            highScore: 0,
            distance: 0,
            speed: 0,
            maxSpeed: 200,
            acceleration: 1.2,
            braking: 3,

            // Player
            player: {
                x: 0,
                y: 0,
                width: 40,
                height: 70,
                targetX: 0,
                lane: 0,
                maxLane: 2,
                laneWidth: 0,
                tilt: 0
            },

            // Road
            road: {
                segments: [],
                segmentCount: 150,
                segmentLength: 30,
                width: 0,
                curve: 0,
                targetCurve: 0,
                offset: 0
            },

            // Traffic
            cars: [],
            obstacles: [],
            coins: [],
            boostItems: [],

            // Visual
            clouds: [],
            trees: [],
            buildings: [],
            particles: [],

            // Timing
            frame: 0,
            spawnTimer: 0,
            coinTimer: 0,
            boostTimer: 0,

            // Camera
            cameraZ: 0,
            fog: 0
        };

        // ============================================
        // HAND TRACKING STATE
        // ============================================
        const hand = {
            tracking: false,
            detected: false,
            x: 0,
            y: 0,
            isFist: false,
            isIndex: false,
            isOpen: false,
            smoothX: 0,
            smoothY: 0,
            filter: new PosFilter()
        };

        // ============================================
        // DOM REFS
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const lc = document.getElementById('landmarkCanvas');

        const speedDisplay = document.getElementById('speedDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const gestureIndicator = document.getElementById('gestureIndicator');
        const gestureText = document.getElementById('gestureText');
        const speedArc = document.getElementById('speedArc');
        const speedDot = document.getElementById('speedDot');

        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');
        const finalScore = document.getElementById('finalScore');
        const finalHighScore = document.getElementById('finalHighScore');

        let cameraInstance = null;
        let handsInstance = null;
        let animId = null;
        let lastTime = 0;

        // ============================================
        // CANVAS SETUP
        // ============================================
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            G.player.width = Math.min(50, canvas.width * 0.05);
            G.player.height = G.player.width * 1.7;
            G.road.width = canvas.width * 0.6;
            G.player.laneWidth = G.road.width / 3;
            G.player.x = canvas.width / 2 - G.player.width / 2;
            G.player.y = canvas.height * 0.7;
            G.player.targetX = G.player.x;
        }

        window.addEventListener('resize', resizeCanvas);

        // ============================================
        // ROAD GENERATION
        // ============================================
        function generateRoad() {
            G.road.segments = [];
            for (let i = 0; i < G.road.segmentCount; i++) {
                G.road.segments.push({
                    curve: 0,
                    elevation: 0,
                    color: i % 2 === 0 ? '#1a1a3e' : '#2a2a4e'
                });
            }
            // Add some curves
            for (let i = 0; i < 10; i++) {
                const idx = Math.floor(Math.random() * G.road.segmentCount);
                const curve = (Math.random() - 0.5) * 4;
                for (let j = 0; j < 20 && idx + j < G.road.segmentCount; j++) {
                    G.road.segments[idx + j].curve += curve * (1 - j / 20);
                }
            }
        }

        // ============================================
        // SCENERY GENERATION
        // ============================================
        function generateScenery() {
            G.clouds = [];
            for (let i = 0; i < 15; i++) {
                G.clouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.3,
                    w: 60 + Math.random() * 120,
                    h: 20 + Math.random() * 30,
                    speed: 0.2 + Math.random() * 0.4,
                    opacity: 0.3 + Math.random() * 0.3
                });
            }

            G.trees = [];
            for (let i = 0; i < 80; i++) {
                G.trees.push({
                    x: (Math.random() - 0.5) * canvas.width * 2,
                    z: Math.random() * G.road.segmentCount * G.road.segmentLength,
                    size: 20 + Math.random() * 30,
                    type: Math.floor(Math.random() * 3)
                });
            }

            G.buildings = [];
            for (let i = 0; i < 30; i++) {
                G.buildings.push({
                    x: (Math.random() - 0.5) * canvas.width * 3,
                    z: Math.random() * G.road.segmentCount * G.road.segmentLength,
                    w: 30 + Math.random() * 50,
                    h: 40 + Math.random() * 100,
                    color: `hsl(${Math.random() * 60 + 220}, 20%, ${15 + Math.random() * 20}%)`
                });
            }
        }

        // ============================================
        // GAME OBJECTS
        // ============================================
        function spawnCar() {
            const lane = Math.floor(Math.random() * 3);
            const z = G.road.segmentCount * G.road.segmentLength + 50 + Math.random() * 300;
            const speed = 30 + Math.random() * 60;
            G.cars.push({
                lane: lane,
                z: z,
                speed: speed,
                width: 36,
                height: 60,
                color: `hsl(${Math.random() * 360}, 70%, 40%)`,
                x: 0
            });
        }

        function spawnCoin() {
            const lane = Math.floor(Math.random() * 3);
            const z = G.road.segmentCount * G.road.segmentLength + 50 + Math.random() * 200;
            G.coins.push({
                lane: lane,
                z: z,
                x: 0,
                y: 0,
                collected: false,
                radius: 12,
                bob: Math.random() * Math.PI * 2
            });
        }

        function spawnBoost() {
            const lane = Math.floor(Math.random() * 3);
            const z = G.road.segmentCount * G.road.segmentLength + 50 + Math.random() * 400;
            G.boostItems.push({
                lane: lane,
                z: z,
                x: 0,
                y: 0,
                collected: false,
                radius: 15,
                bob: Math.random() * Math.PI * 2
            });
        }

        // ============================================
        // GAME LOGIC
        // ============================================
        function initGame() {
            G.running = true;
            G.over = false;
            G.score = 0;
            G.distance = 0;
            G.speed = 0;
            G.frame = 0;
            G.spawnTimer = 0;
            G.coinTimer = 0;
            G.boostTimer = 0;
            G.cars = [];
            G.coins = [];
            G.boostItems = [];
            G.particles = [];
            G.road.offset = 0;
            G.road.curve = 0;
            G.road.targetCurve = 0;
            G.player.x = canvas.width / 2 - G.player.width / 2;
            G.player.targetX = G.player.x;
            G.player.tilt = 0;

            generateRoad();
            generateScenery();

            // Initial cars
            for (let i = 0; i < 5; i++) spawnCar();

            gameOverScreen.classList.remove('show');
            startScreen.classList.add('hidden');
            gestureIndicator.classList.add('show');

            updateHUD();
        }

        function updateGame() {
            if (!G.running || G.over || G.paused) return;

            G.frame++;
            G.distance += G.speed * 0.01;

            // Speed control
            const targetSpeed = G.maxSpeed * (0.3 + G.score / 5000);
            const maxTarget = Math.min(G.maxSpeed, 100 + G.score / 20);

            // Hand controls
            if (hand.tracking && hand.detected) {
                // Steering
                const steerX = (hand.smoothX - 0.5) * 3;
                G.player.targetX += steerX * 3;
                G.player.tilt = -steerX * 0.3;

                // Acceleration: open hand
                if (hand.isOpen && !hand.isFist) {
                    G.speed = Math.min(G.speed + G.acceleration * 0.5, maxTarget);
                }

                // Boost: index finger up
                if (hand.isIndex && !hand.isFist) {
                    G.speed = Math.min(G.speed + G.acceleration * 2, maxTarget * 1.3);
                }

                // Brake: fist
                if (hand.isFist) {
                    G.speed = Math.max(G.speed - G.braking * 0.8, 0);
                }

                // Coasting
                if (!hand.isOpen && !hand.isFist && !hand.isIndex) {
                    G.speed *= 0.98;
                }
            } else {
                // Keyboard fallback
                G.speed = Math.max(G.speed - 0.5, 0);
            }

            // Clamp speed
            G.speed = Math.max(0, Math.min(G.speed, maxTarget));

            // Auto-brake at low speed
            if (G.speed < 1) G.speed = 0;

            // Move player
            const maxX = canvas.width - G.player.width;
            G.player.targetX = Math.max(0, Math.min(G.player.targetX, maxX));
            G.player.x += (G.player.targetX - G.player.x) * 0.1;

            // Road offset
            G.road.offset += G.speed * 0.02;
            if (G.road.offset > G.road.segmentLength) {
                G.road.offset -= G.road.segmentLength;
                // Shift road
                G.road.segments.push(G.road.segments.shift());
                // Add new curve
                if (Math.random() < 0.1) {
                    G.road.segments[G.road.segments.length - 1].curve = (Math.random() - 0.5) * 3;
                } else {
                    G.road.segments[G.road.segments.length - 1].curve = 0;
                }
            }

            // Score
            G.score += G.speed * 0.02;

            // Spawn cars
            G.spawnTimer++;
            const spawnRate = Math.max(20, 60 - G.score / 100);
            if (G.spawnTimer > spawnRate) {
                G.spawnTimer = 0;
                spawnCar();
            }

            // Spawn coins
            G.coinTimer++;
            if (G.coinTimer > 15 + Math.random() * 20) {
                G.coinTimer = 0;
                spawnCoin();
            }

            // Spawn boosts
            G.boostTimer++;
            if (G.boostTimer > 100 + Math.random() * 100) {
                G.boostTimer = 0;
                spawnBoost();
            }

            // Update cars
            for (let i = G.cars.length - 1; i >= 0; i--) {
                const car = G.cars[i];
                car.z -= G.speed * 0.3 + car.speed * 0.1;
                car.x = canvas.width / 2 - G.road.width / 2 + (car.lane + 0.5) * G.player.laneWidth - G.player.width / 2;

                // Check collision
                if (car.z < 0 && car.z > -100) {
                    const dx = Math.abs(G.player.x - car.x);
                    const dy = Math.abs(G.player.y - (canvas.height * 0.7));
                    if (dx < G.player.width * 0.7 && dy < G.player.height * 0.7) {
                        gameOver();
                        return;
                    }
                }

                if (car.z < -200) {
                    G.cars.splice(i, 1);
                }
            }

            // Update coins
            for (let i = G.coins.length - 1; i >= 0; i--) {
                const coin = G.coins[i];
                coin.z -= G.speed * 0.3;
                coin.x = canvas.width / 2 - G.road.width / 2 + (coin.lane + 0.5) * G.player.laneWidth - 10;
                coin.y = canvas.height * 0.6 + Math.sin(coin.bob) * 15;
                coin.bob += 0.05;

                if (!coin.collected && coin.z < 0 && coin.z > -50) {
                    const dx = Math.abs(G.player.x + G.player.width / 2 - coin.x);
                    const dy = Math.abs(G.player.y + G.player.height / 2 - coin.y);
                    if (dx < 30 && dy < 30) {
                        coin.collected = true;
                        G.score += 25;
                        createParticles(coin.x, coin.y, '#fbbf24', 20);
                        updateHUD();
                    }
                }

                if (coin.z < -200) {
                    G.coins.splice(i, 1);
                }
            }

            // Update boosts
            for (let i = G.boostItems.length - 1; i >= 0; i--) {
                const boost = G.boostItems[i];
                boost.z -= G.speed * 0.3;
                boost.x = canvas.width / 2 - G.road.width / 2 + (boost.lane + 0.5) * G.player.laneWidth - 15;
                boost.y = canvas.height * 0.6 + Math.sin(boost.bob) * 20;
                boost.bob += 0.08;

                if (!boost.collected && boost.z < 0 && boost.z > -50) {
                    const dx = Math.abs(G.player.x + G.player.width / 2 - boost.x);
                    const dy = Math.abs(G.player.y + G.player.height / 2 - boost.y);
                    if (dx < 35 && dy < 35) {
                        boost.collected = true;
                        G.speed = Math.min(G.speed + 50, G.maxSpeed * 1.5);
                        createParticles(boost.x, boost.y, '#4ade80', 30);
                        updateHUD();
                    }
                }

                if (boost.z < -200) {
                    G.boostItems.splice(i, 1);
                }
            }

            // Update clouds
            for (const cloud of G.clouds) {
                cloud.x += cloud.speed * (G.speed / 100);
                if (cloud.x > canvas.width + cloud.w) cloud.x = -cloud.w;
            }

            // Update HUD
            updateHUD();

            // Gesture indicator
            updateGestureIndicator();
        }

        function gameOver() {
            G.over = true;
            G.running = false;
            if (G.score > G.highScore) {
                G.highScore = G.score;
                localStorage.setItem('handRacingHighScore', G.highScore);
            }
            finalScore.textContent = Math.floor(G.score);
            finalHighScore.textContent = Math.floor(G.highScore);
            gameOverScreen.classList.add('show');
            gestureIndicator.classList.remove('show');
            createParticles(G.player.x + G.player.width / 2, G.player.y + G.player.height / 2, '#ef4444', 50);
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                G.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    life: 60 + Math.random() * 60,
                    maxLife: 120,
                    size: 3 + Math.random() * 5,
                    color: color,
                    gravity: 0.1
                });
            }
        }

        function updateHUD() {
            speedDisplay.textContent = Math.floor(G.speed);
            distanceDisplay.textContent = Math.floor(G.distance);
            scoreDisplay.textContent = Math.floor(G.score);
            highScoreDisplay.textContent = Math.floor(G.highScore);

            // Speedometer arc
            const percent = G.speed / G.maxSpeed;
            const offset = 314 - (percent * 314);
            speedArc.style.strokeDashoffset = offset;
            speedDot.setAttribute('transform', `rotate(${-90 + percent * 180} 60 60)`);
        }

        function updateGestureIndicator() {
            if (!hand.tracking || !hand.detected) {
                gestureIndicator.classList.remove('show');
                return;
            }

            gestureIndicator.classList.add('show');

            let emoji = '🏃';
            let text = 'Driving';

            if (hand.isFist) {
                emoji = '✊';
                text = 'Braking!';
            } else if (hand.isIndex) {
                emoji = '☝️';
                text = 'BOOST!';
            } else if (hand.isOpen) {
                emoji = '🖐️';
                text = 'Accelerating';
            }

            if (Math.abs(hand.smoothX - 0.5) > 0.15) {
                const dir = hand.smoothX < 0.5 ? '⬅️' : '➡️';
                text += ' ' + dir;
            }

            document.querySelector('#gestureIndicator .emoji').textContent = emoji;
            gestureText.textContent = text;
        }

        // ============================================
        // RENDERING
        // ============================================
        function render() {
            const W = canvas.width;
            const H = canvas.height;

            // Clear
            ctx.clearRect(0, 0, W, H);

            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
            skyGrad.addColorStop(0, '#0a0a2e');
            skyGrad.addColorStop(0.5, '#1a1a4e');
            skyGrad.addColorStop(1, '#2a2a4e');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H * 0.6);

            // Stars
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137.5 + 42) % W;
                const y = (i * 97.3 + 13) % (H * 0.4);
                const s = 0.5 + (i % 3) * 0.5;
                ctx.beginPath();
                ctx.arc(x, y, s, 0, Math.PI * 2);
                ctx.fill();
            }

            // Clouds
            for (const cloud of G.clouds) {
                ctx.globalAlpha = cloud.opacity * 0.5;
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath();
                ctx.ellipse(cloud.x, cloud.y, cloud.w / 2, cloud.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cloud.x - cloud.w / 3, cloud.y + 5, cloud.w / 3, cloud.h / 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(cloud.x + cloud.w / 3, cloud.y + 3, cloud.w / 4, cloud.h / 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Road
            const roadW = G.road.width;
            const roadLeft = W / 2 - roadW / 2;
            const roadRight = W / 2 + roadW / 2;

            // Road surface
            const roadGrad = ctx.createLinearGradient(roadLeft, 0, roadRight, 0);
            roadGrad.addColorStop(0, '#1a1a2e');
            roadGrad.addColorStop(0.05, '#2a2a4e');
            roadGrad.addColorStop(0.5, '#3a3a5e');
            roadGrad.addColorStop(0.95, '#2a2a4e');
            roadGrad.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = roadGrad;
            ctx.fillRect(roadLeft, H * 0.2, roadW, H * 0.8);

            // Road markings
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 30]);
            const dashOffset = -(G.road.offset * 0.5) % 50;
            for (let i = 0; i < 10; i++) {
                const y = H * 0.2 + i * (H * 0.08);
                ctx.beginPath();
                ctx.moveTo(W / 2, y);
                ctx.lineTo(W / 2, y + H * 0.04);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Lane lines
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            for (let l = 1; l < 3; l++) {
                const x = roadLeft + l * roadW / 3;
                ctx.setLineDash([15, 25]);
                ctx.beginPath();
                ctx.moveTo(x, H * 0.2);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Road edges
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(roadLeft, H * 0.2);
            ctx.lineTo(roadLeft, H);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(roadRight, H * 0.2);
            ctx.lineTo(roadRight, H);
            ctx.stroke();

            // Buildings (background)
            for (const building of G.buildings) {
                const dz = building.z - G.distance * 0.5;
                if (dz < -100 || dz > 200) continue;
                const scale = 1 / (1 + dz / 500);
                const x = W / 2 + building.x * scale * 0.5;
                const y = H * 0.5 + (dz / 200) * 50;
                const w = building.w * scale * 0.3;
                const h = building.h * scale * 0.3;
                if (x > 0 && x < W && y > 0 && y < H) {
                    ctx.fillStyle = building.color;
                    ctx.fillRect(x - w / 2, y - h, w, h);
                    // Windows
                    ctx.fillStyle = 'rgba(255,255,200,0.1)';
                    for (let wi = 0; wi < 3; wi++) {
                        for (let wj = 0; wj < 4; wj++) {
                            if (Math.random() > 0.3) {
                                ctx.fillRect(x - w / 2 + wi * (w / 3) + 2, y - h + wj * (h / 4) + 2, w / 4, h / 6);
                            }
                        }
                    }
                }
            }

            // Trees
            for (const tree of G.trees) {
                const dz = tree.z - G.distance * 0.5;
                if (dz < -50 || dz > 150) continue;
                const scale = 1 / (1 + dz / 300);
                const x = W / 2 + tree.x * scale * 0.6;
                const y = H * 0.6 + (dz / 200) * 30;
                const s = tree.size * scale * 0.4;
                if (x > 0 && x < W && y > 0 && y < H) {
                    // Trunk
                    ctx.fillStyle = '#2a1a0a';
                    ctx.fillRect(x - s * 0.05, y - s * 0.2, s * 0.1, s * 0.3);
                    // Leaves
                    ctx.fillStyle = tree.type === 0 ? '#1a4a1a' : '#2a5a2a';
                    ctx.beginPath();
                    ctx.arc(x, y - s * 0.3, s * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x - s * 0.2, y - s * 0.1, s * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x + s * 0.2, y - s * 0.1, s * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Cars (traffic)
            for (const car of G.cars) {
                const dz = car.z - G.distance * 0.5;
                if (dz < -50 || dz > 100) continue;
                const scale = 1 / (1 + dz / 200);
                const x = car.x + G.player.width / 2;
                const y = G.player.y + dz * 0.3;
                const w = car.width * scale * 0.6;
                const h = car.height * scale * 0.6;
                if (x > 0 && x < W && y > 0 && y < H) {
                    // Shadow
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(x, y + h / 2 + 5, w / 2, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Body
                    ctx.fillStyle = car.color;
                    ctx.beginPath();
                    ctx.roundRect(x - w / 2, y - h / 2, w, h, 5);
                    ctx.fill();
                    // Windows
                    ctx.fillStyle = 'rgba(100,150,255,0.4)';
                    ctx.beginPath();
                    ctx.roundRect(x - w / 3, y - h / 3, w * 0.4, h * 0.3, 3);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.roundRect(x + w / 6, y - h / 3, w * 0.3, h * 0.3, 3);
                    ctx.fill();
                    // Headlights
                    ctx.fillStyle = 'rgba(255,255,200,0.3)';
                    ctx.fillRect(x - w / 2, y - h / 2, 5, 3);
                    ctx.fillRect(x + w / 2 - 5, y - h / 2, 5, 3);
                }
            }

            // Coins
            for (const coin of G.coins) {
                if (coin.collected) continue;
                const dz = coin.z - G.distance * 0.5;
                if (dz < -50 || dz > 100) continue;
                const scale = 1 / (1 + dz / 200);
                const x = coin.x;
                const y = coin.y + dz * 0.3;
                const r = coin.radius * scale * 0.6;
                if (x > 0 && x < W && y > 0 && y < H) {
                    // Glow
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Inner
                    ctx.fillStyle = '#fcd34d';
                    ctx.beginPath();
                    ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Boost items
            for (const boost of G.boostItems) {
                if (boost.collected) continue;
                const dz = boost.z - G.distance * 0.5;
                if (dz < -50 || dz > 100) continue;
                const scale = 1 / (1 + dz / 200);
                const x = boost.x;
                const y = boost.y + dz * 0.3;
                const r = boost.radius * scale * 0.6;
                if (x > 0 && x < W && y > 0 && y < H) {
                    // Glow
                    ctx.shadowColor = '#4ade80';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#4ade80';
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Inner
                    ctx.fillStyle = '#86efac';
                    ctx.font = `${r * 1.2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', x, y + 2);
                }
            }

            // Player car
            const px = G.player.x;
            const py = G.player.y;
            const pw = G.player.width;
            const ph = G.player.height;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(px + pw / 2, py + ph + 10, pw / 2, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Car body with tilt
            ctx.save();
            ctx.translate(px + pw / 2, py + ph / 2);
            ctx.rotate(G.player.tilt * 0.05);

            // Body
            const bodyGrad = ctx.createLinearGradient(0, -ph / 2, 0, ph / 2);
            bodyGrad.addColorStop(0, '#ef4444');
            bodyGrad.addColorStop(0.5, '#dc2626');
            bodyGrad.addColorStop(1, '#991b1b');
            ctx.fillStyle = bodyGrad;
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 8);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Racing stripe
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(-pw / 6, -ph / 2, pw / 3, ph);

            // Windows
            ctx.fillStyle = 'rgba(100,180,255,0.5)';
            ctx.beginPath();
            ctx.roundRect(-pw / 2 + 4, -ph / 2 + 4, pw * 0.35, ph * 0.3, 4);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(pw / 2 - pw * 0.35 - 4, -ph / 2 + 4, pw * 0.35, ph * 0.3, 4);
            ctx.fill();

            // Headlights
            ctx.fillStyle = 'rgba(255,255,200,0.6)';
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 10;
            ctx.fillRect(-pw / 2, -ph / 2, 6, 4);
            ctx.fillRect(pw / 2 - 6, -ph / 2, 6, 4);
            ctx.shadowBlur = 0;

            // Tail lights
            ctx.fillStyle = 'rgba(255,0,0,0.6)';
            ctx.fillRect(-pw / 2, ph / 2 - 4, 6, 4);
            ctx.fillRect(pw / 2 - 6, ph / 2 - 4, 6, 4);

            // Spoiler
            ctx.fillStyle = '#111';
            ctx.fillRect(-pw / 2 + 5, -ph / 2 - 4, pw - 10, 4);

            // Headlight glow
            ctx.fillStyle = 'rgba(255,255,200,0.1)';
            ctx.beginPath();
            ctx.ellipse(0, -ph / 2 - 10, pw / 4, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Particles
            for (let i = G.particles.length - 1; i >= 0; i--) {
                const p = G.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.life--;
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
                if (p.life <= 0) G.particles.splice(i, 1);
            }

            // Speed lines at high speed
            if (G.speed > 100) {
                const intensity = (G.speed - 100) / 100;
                ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.05})`;
                ctx.lineWidth = 1;
                for (let i = 0; i < 20 * intensity; i++) {
                    const x = Math.random() * W;
                    const y = Math.random() * H;
                    const len = 20 + Math.random() * 50;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + len * 0.3, y + len);
                    ctx.stroke();
                }
            }

            // Vignette
            const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, W, H);

            // HUD blur background
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(10, 10, 200, 40);
            ctx.fillRect(W - 200, 10, 190, 40);
        }

        // ============================================
        // ROUND RECT POLYFILL
        // ============================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ============================================
        // GAME LOOP
        // ============================================
        function gameLoop(timestamp) {
            const dt = lastTime ? (timestamp - lastTime) / 16.67 : 1;
            lastTime = timestamp;

            if (G.running && !G.over) {
                for (let i = 0; i < Math.ceil(dt); i++) {
                    updateGame();
                }
            }

            render();
            animId = requestAnimationFrame(gameLoop);
        }

        // ============================================
        // HAND TRACKING
        // ============================================
        function onHandResults(results) {
            if (!hand.tracking) return;

            const lcCtx = lc.getContext('2d');
            lc.width = video.videoWidth || 640;
            lc.height = video.videoHeight || 480;
            lcCtx.clearRect(0, 0, lc.width, lc.height);
            lcCtx.drawImage(video, 0, 0, lc.width, lc.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                hand.detected = true;
                const lm = results.multiHandLandmarks[0];

                // Draw landmarks
                const du = window;
                du.drawConnectors(lcCtx, lm, du.HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
                du.drawLandmarks(lcCtx, lm, { color: '#FF0000', lineWidth: 1 });

                // Get index finger tip
                const tip = lm[8];
                const rawX = tip.x * lc.width;
                const rawY = tip.y * lc.height;

                // Filter
                const filtered = hand.filter.update(rawX, rawY);
                hand.x = filtered.x / lc.width;
                hand.y = filtered.y / lc.height;
                hand.smoothX = hand.x;
                hand.smoothY = hand.y;

                // Gesture detection
                const tips = [8, 12, 16, 20];
                const joints = [6, 10, 14, 18];
                let folded = 0;
                for (let i = 0; i < tips.length; i++) {
                    if (lm[tips[i]].y > lm[joints[i]].y) folded++;
                }
                hand.isFist = folded >= 3;

                // Index finger up
                hand.isIndex = !hand.isFist &&
                    lm[8].y < lm[6].y &&
                    lm[12].y > lm[10].y &&
                    lm[16].y > lm[14].y &&
                    lm[20].y > lm[18].y;

                // Open hand
                hand.isOpen = !hand.isFist && !hand.isIndex &&
                    lm[8].y < lm[6].y &&
                    lm[12].y < lm[10].y &&
                    lm[16].y < lm[14].y &&
                    lm[20].y < lm[18].y;

                // Draw finger tip
                lcCtx.beginPath();
                lcCtx.arc(rawX, rawY, 10, 0, Math.PI * 2);
                lcCtx.fillStyle = hand.isFist ? '#FF0000' : hand.isIndex ? '#00FF00' : '#FFD700';
                lcCtx.fill();

                // Show gesture on video
                lcCtx.fillStyle = 'rgba(0,0,0,0.5)';
                lcCtx.fillRect(10, 10, 200, 30);
                lcCtx.fillStyle = 'white';
                lcCtx.font = '16px Arial';
                let gText = '🖐️ Open';
                if (hand.isFist) gText = '✊ Fist (Brake)';
                else if (hand.isIndex) gText = '☝️ Index (Boost)';
                else if (hand.isOpen) gText = '🖐️ Open (Accelerate)';
                lcCtx.fillText('🚗 ' + gText, 20, 32);

                lc.style.display = 'block';
                video.style.display = 'none';

                // Update game with hand position
                if (G.running && !G.over) {
                    // Steering
                    const steerX = (hand.smoothX - 0.5) * 4;
                    G.player.targetX += steerX * 2;
                    G.player.tilt = -steerX * 0.3;

                    // Clamp
                    const maxX = canvas.width - G.player.width;
                    G.player.targetX = Math.max(0, Math.min(G.player.targetX, maxX));
                }

            } else {
                hand.detected = false;
                lc.style.display = 'none';
                video.style.display = 'block';
            }
        }

        // ============================================
        // CAMERA SETUP
        // ============================================
        async function startTracking() {
            try {
                hand.tracking = true;
                if (typeof Hands === 'undefined') {
                    throw new Error('MediaPipe not loaded');
                }

                handsInstance = new Hands({
                    locateFile: (file) =>
                        `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
                });

                handsInstance.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5
                });

                handsInstance.onResults(onHandResults);

                cameraInstance = new Camera(video, {
                    onFrame: async () => {
                        try { await handsInstance.send({ image: video }); } catch (e) {}
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'user'
                });

                await cameraInstance.start();
                console.log('✅ Hand tracking started');

            } catch (err) {
                console.error('❌ Tracking error:', err);
                hand.tracking = false;
            }
        }

        function stopTracking() {
            hand.tracking = false;
            if (cameraInstance) { try { cameraInstance.stop(); } catch (e) {} }
            if (handsInstance) { try { handsInstance.close(); } catch (e) {} }
            cameraInstance = null;
            handsInstance = null;
            video.style.display = 'none';
            lc.style.display = 'none';
        }

        // ============================================
        // GAME CONTROLS
        // ============================================
        function startGame() {
            if (!hand.tracking) {
                startTracking().then(() => {
                    setTimeout(initGame, 500);
                });
            } else {
                initGame();
            }
        }

        function restartGame() {
            initGame();
        }

        // ============================================
        // KEYBOARD CONTROLS (Fallback)
        // ============================================
        const keys = { up: false, down: false, left: false, right: false, space: false };

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    keys.up = true;
                    if (G.running && !G.over) {
                        G.speed = Math.min(G.speed + G.acceleration * 2, G.maxSpeed * 1.3);
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                    keys.down = true;
                    if (G.running && !G.over) {
                        G.speed = Math.max(G.speed - G.braking * 2, 0);
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                    keys.left = true;
                    if (G.running && !G.over) {
                        G.player.targetX -= 10;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                    keys.right = true;
                    if (G.running && !G.over) {
                        G.player.targetX += 10;
                    }
                    e.preventDefault();
                    break;
                case ' ':
                    keys.space = true;
                    if (!G.running && !G.over) startGame();
                    else if (G.over) restartGame();
                    else { G.paused = !G.paused; }
                    e.preventDefault();
                    break;
                case 'r':
                    if (G.over) restartGame();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    keys.up = false;
                    break;
                case 'ArrowDown':
                case 's':
                    keys.down = false;
                    break;
                case 'ArrowLeft':
                case 'a':
                    keys.left = false;
                    break;
                case 'ArrowRight':
                case 'd':
                    keys.right = false;
                    break;
                case ' ':
                    keys.space = false;
                    break;
            }
        });

        // ============================================
        // TOUCH CONTROLS
        // ============================================
        let touchX = null;
        let touchY = null;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            touchX = t.clientX;
            touchY = t.clientY;

            if (!G.running && !G.over) startGame();
            else if (G.over) restartGame();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!G.running || G.over) return;
            const t = e.touches[0];
            const dx = t.clientX - touchX;
            G.player.targetX += dx * 0.5;
            touchX = t.clientX;

            // Speed control via vertical position
            const dy = t.clientY - touchY;
            if (dy < -20) {
                G.speed = Math.min(G.speed + G.acceleration, G.maxSpeed);
            } else if (dy > 20) {
                G.speed = Math.max(G.speed - G.braking, 0);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            touchX = null;
            touchY = null;
        }, { passive: true });

        // ============================================
        // PWA INSTALL
        // ============================================
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    document.getElementById('installBanner').classList.remove('show');
                }
                deferredPrompt = null;
            }
        });

        // ============================================
        // INIT
        // ============================================
        resizeCanvas();
        generateRoad();
        generateScenery();

        // Load high score
        G.highScore = parseInt(localStorage.getItem('handRacingHighScore')) || 0;
        highScoreDisplay.textContent = G.highScore;

        // Start game loop
        gameLoop(0);

        // Start tracking automatically
        startTracking();

        // Button events
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', restartGame);

        console.log('🏎️ Hand Racing Game Loaded!');
        console.log('🖐️ Use hand gestures to drive!');
        console.log('📱 Install as PWA for best experience');

        // Handle visibility change (pause when tab hidden)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && G.running && !G.over) {
                G.paused = true;
            } else if (!document.hidden && G.running && !G.over) {
                G.paused = false;
            }
        });
    </script>
</body>
</html>
