<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⌨️ AirType Pro</title>
    <style>
        /* ============================================
           IMPORTS & RESET
           ============================================ */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.3);
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --accent-glow: rgba(102, 126, 234, 0.3);
            --success: #4ade80;
            --error: #ef4444;
            --warning: #fbbf24;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: none;
            color: var(--text-primary);
        }

        /* ============================================
           APP CONTAINER
           ============================================ */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, var(--bg-primary) 70%);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow: hidden;
        }

        /* ============================================
           ANIMATED BACKGROUND
           ============================================ */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }

        /* ============================================
           HEADER
           ============================================ */
        #header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, rgba(255, 255, 255, 0.7));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            font-weight: 300;
            -webkit-text-fill-color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .status-dot.on {
            background: var(--success);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
            animation: pulse-dot 2s infinite;
        }

        .status-dot.off {
            background: var(--error);
        }

        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.7;
            }
        }

        .status-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            font-family: inherit;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            transform: scale(1.02);
        }

        .header-btn:active {
            transform: scale(0.95);
        }

        .header-btn.primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .header-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        /* ============================================
           TEXT DISPLAY
           ============================================ */
        #textDisplay {
            position: relative;
            z-index: 10;
            flex: 1;
            min-height: 0;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #textDisplay .text-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        #textDisplay .text-scroll::-webkit-scrollbar {
            width: 4px;
        }

        #textDisplay .text-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        #textDisplay .text-scroll::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 10px;
        }

        #textDisplay .text-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        .text-content {
            color: var(--text-primary);
            font-size: clamp(1.4rem, 3.5vw, 2.8rem);
            line-height: 1.6;
            min-height: 60px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .text-content .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--accent-1);
            animation: blink-cursor 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
            border-radius: 2px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        @keyframes blink-cursor {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .text-content .placeholder {
            color: var(--text-muted);
            font-weight: 300;
            font-size: clamp(1rem, 2vw, 1.6rem);
        }

        .text-stats {
            display: flex;
            gap: 20px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            flex-shrink: 0;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-item .value {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .stat-item .value.highlight {
            color: var(--accent-1);
        }

        .stat-item .value.success {
            color: var(--success);
        }

        /* ============================================
           KEYBOARD
           ============================================ */
        #keyboard {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 12px 16px 14px;
            transition: var(--transition);
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .kb-row:last-child {
            margin-bottom: 0;
        }

        .kb-key {
            position: relative;
            padding: 6px 4px;
            min-width: 34px;
            height: 40px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            max-width: 56px;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
        }

        .kb-key:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .kb-key:active {
            transform: scale(0.92);
        }

        .kb-key .key-label {
            font-size: 0.5rem;
            opacity: 0.4;
            position: absolute;
            bottom: 2px;
            right: 4px;
        }

        .kb-key .gesture-hint {
            font-size: 0.45rem;
            opacity: 0.25;
            position: absolute;
            top: 2px;
            left: 4px;
        }

        .kb-key.special {
            flex: 1.3;
            max-width: 70px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .kb-key.space {
            flex: 4;
            max-width: 200px;
            background: rgba(255, 255, 255, 0.03);
            letter-spacing: 4px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Key states */
        .kb-key.hover {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
            color: white;
        }

        .kb-key.active-key {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            transform: scale(0.92);
            box-shadow: 0 4px 20px var(--accent-glow);
            border-color: transparent;
        }

        .kb-key.pressed {
            animation: key-press 0.2s ease;
        }

        @keyframes key-press {
            0% {
                transform: scale(0.85);
            }
            50% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
            }
        }

        .kb-key .key-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ============================================
           CAMERA FEED
           ============================================ */
        #cameraFeed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 135px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 20;
            background: var(--bg-primary);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        #cameraFeed:hover {
            transform: scale(1.05);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }

        #cameraFeed.minimized {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            bottom: 20px;
            right: 20px;
        }

        #cameraFeed video {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            object-fit: cover;
        }

        #cameraFeed .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        #cameraFeed .finger-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--success);
            background: rgba(74, 222, 128, 0.25);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: all 0.05s linear;
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
            display: none;
        }

        #cameraFeed .feed-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            font-size: 0.55rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feed-badge .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }

        .feed-badge .dot.on {
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        .feed-badge .dot.off {
            background: var(--error);
        }

        #cameraFeed .toggle-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 0.6rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        #cameraFeed:hover .toggle-btn {
            opacity: 1;
        }

        #cameraFeed .toggle-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }

        /* ============================================
           GESTURE INDICATOR
           ============================================ */
        #gestureBar {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            padding: 8px 20px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: var(--shadow);
        }

        #gestureBar.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #gestureBar .emoji {
            font-size: 1.2rem;
        }

        #gestureBar .text {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        #gestureBar .text strong {
            color: var(--text-primary);
        }

        #gestureBar .action {
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action.idle {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .action.pointing {
            background: rgba(74, 222, 128, 0.15);
            color: var(--success);
        }

        .action.clicking {
            background: rgba(102, 126, 234, 0.2);
            color: var(--accent-1);
            animation: pulse-action 0.5s ease;
        }

        @keyframes pulse-action {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* ============================================
           TOAST
           ============================================ */
        #toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: var(--shadow);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            #app {
                padding: 10px;
                gap: 8px;
            }

            #header {
                padding: 8px 14px;
            }

            .logo-text {
                font-size: 0.9rem;
            }
            .logo-icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            .status-label {
                font-size: 0.6rem;
            }
            .header-btn {
                font-size: 0.65rem;
                padding: 6px 12px;
            }

            #textDisplay {
                padding: 14px 16px;
            }
            .text-content {
                font-size: clamp(1rem, 2.8vw, 1.8rem);
            }
            .text-stats {
                gap: 12px;
            }
            .stat-item {
                font-size: 0.6rem;
            }
            .stat-item .value {
                font-size: 0.75rem;
            }

            #keyboard {
                padding: 8px 10px 10px;
            }
            .kb-key {
                min-width: 24px;
                height: 32px;
                font-size: 0.6rem;
                padding: 4px;
                max-width: 38px;
                border-radius: 6px;
            }
            .kb-key.special {
                max-width: 48px;
                font-size: 0.5rem;
            }
            .kb-key.space {
                max-width: 120px;
            }
            .kb-row {
                gap: 3px;
                margin-bottom: 3px;
            }

            #cameraFeed {
                width: 120px;
                height: 90px;
                bottom: 12px;
                right: 12px;
            }

            #gestureBar {
                bottom: 70px;
                padding: 6px 14px;
                gap: 8px;
            }
            #gestureBar .emoji {
                font-size: 1rem;
            }
            #gestureBar .text {
                font-size: 0.7rem;
            }
            #gestureBar .action {
                font-size: 0.55rem;
                padding: 2px 8px;
            }
        }

        @media (max-width: 480px) {
            .kb-key {
                min-width: 18px;
                height: 26px;
                font-size: 0.5rem;
                max-width: 28px;
                border-radius: 4px;
            }
            .kb-key.special {
                max-width: 34px;
                font-size: 0.4rem;
            }
            .kb-key.space {
                max-width: 70px;
            }
            #cameraFeed {
                width: 80px;
                height: 60px;
                bottom: 8px;
                right: 8px;
                border-radius: 8px;
            }
            #header h1 {
                font-size: 0.8rem;
            }
            .text-content {
                font-size: clamp(0.8rem, 2.2vw, 1.2rem);
            }
            #textDisplay {
                padding: 10px 12px;
            }
        }

        /* ============================================
           UTILITY
           ============================================ */
        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Background Animation -->
        <canvas id="bgCanvas"></canvas>

        <!-- ===== HEADER ===== -->
        <header id="header">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon">⌨️</div>
                    <span class="logo-text">AirType <span>Pro</span></span>
                </div>
            </div>
            <div class="header-right">
                <div class="status-indicator">
                    <span class="status-dot off" id="statusDot"></span>
                    <span class="status-label" id="statusLabel">Offline</span>
                </div>
                <button class="header-btn" id="clearBtn" title="Clear text">🗑️</button>
                <button class="header-btn" id="copyBtn" title="Copy to clipboard">📋</button>
                <button class="header-btn primary" id="trackingToggle">🖐️ Start</button>
            </div>
        </header>

        <!-- ===== TEXT DISPLAY ===== -->
        <div id="textDisplay">
            <div class="text-scroll" id="textScroll">
                <div class="text-content" id="textContent">
                    <span class="placeholder">👆 Point at keys to type in the air</span>
                    <span class="cursor"></span>
                </div>
            </div>
            <div class="text-stats">
                <div class="stat-item">
                    📝 <span class="value" id="charCount">0</span> chars
                </div>
                <div class="stat-item">
                    📊 <span class="value" id="wordCount">0</span> words
                </div>
                <div class="stat-item">
                    ⚡ <span class="value highlight" id="wpmDisplay">0</span> WPM
                </div>
                <div class="stat-item" style="margin-left:auto;">
                    <span id="capsIndicator" style="font-size:0.6rem;color:var(--text-muted);">🔓</span>
                </div>
            </div>
        </div>

        <!-- ===== KEYBOARD ===== -->
        <div id="keyboard">
            <!-- Row 1 -->
            <div class="kb-row">
                <button class="kb-key" data-key="`">`<span class="key-label">~</span></button>
                <button class="kb-key" data-key="1">1<span class="key-label">!</span></button>
                <button class="kb-key" data-key="2">2<span class="key-label">@</span></button>
                <button class="kb-key" data-key="3">3<span class="key-label">#</span></button>
                <button class="kb-key" data-key="4">4<span class="key-label">$</span></button>
                <button class="kb-key" data-key="5">5<span class="key-label">%</span></button>
                <button class="kb-key" data-key="6">6<span class="key-label">^</span></button>
                <button class="kb-key" data-key="7">7<span class="key-label">&amp;</span></button>

        <!-- ===== CAMERA FEED ===== -->
        <div id="cameraFeed">
            <video id="video" autoplay playsinline></video>

            <span class="action idle" id="gestureAction">Idle</span>

        <!-- ===== TOAST ===== -->
        <div id="toast"></div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous">
    </script>

    <script>
        // ============================================
        // KALMAN FILTER - Professional Grade Smoothing
        // ============================================
        class KalmanFilter {
            constructor(processNoise = 0.08, measurementNoise = 0.25, initialValue = 0) {
                this.processNoise = processNoise;
                this.measurementNoise = measurementNoise;
                this.estimate = initialValue;
                this.errorCovariance = 1;
                this.gain = 0;
            }

            update(measurement) {
                // Prediction
                const predictedEstimate = this.estimate;
                const predictedErrorCovariance = this.errorCovariance + this.processNoise;

                // Update
                this.gain = predictedErrorCovariance / (predictedErrorCovariance + this.measurementNoise);
                this.estimate = predictedEstimate + this.gain * (measurement - predictedEstimate);
                this.errorCovariance = (1 - this.gain) * predictedErrorCovariance;

                return this.estimate;
            }

            reset(value = 0) {
                this.estimate = value;
                this.errorCovariance = 1;
                this.gain = 0;
            }
        }

        class PositionFilter {
            constructor() {
                this.x = new KalmanFilter(0.06, 0.2, 0);
                this.y = new KalmanFilter(0.06, 0.2, 0);
                this.hasData = false;
            }

            update(rawX, rawY) {
                if (!this.hasData) {
                    this.x.reset(rawX);
                    this.y.reset(rawY);
                    this.hasData = true;
                    return { x: rawX, y: rawY };
                }
                return {
                    x: this.x.update(rawX),
                    y: this.y.update(rawY)
                };
            }

            reset() {
                this.hasData = false;
                this.x.reset(0);
                this.y.reset(0);
            }
        }

        // ============================================
        // APPLICATION STATE
        // ============================================
        const App = {
            // Text
            text: '',
            cursor: 0,
            // Keyboard
            capsLock: false,
            shift: false,
            // Tracking
            isTracking: false,
            handDetected: false,
            handX: 0.5,
            handY: 0.5,
            isFist: false,
            isPointing: false,
            // Interaction
            hoverKey: null,
            keyCooldown: 0,
            // Stats
            charCount: 0,
            wordCount: 0,
            wpm: 0,
            typingBuffer: [],
            startTime: Date.now(),
            // Filter
            filter: new PositionFilter(),
            // UI
            toastTimeout: null
        };

        // ============================================
        // DOM REFS
        // ============================================
        const $ = (id) => document.getElementById(id);

        const dom = {
            textContent: $('textContent'),
            textScroll: $('textScroll'),
            charCount: $('charCount'),
            wordCount: $('wordCount'),
            wpmDisplay: $('wpmDisplay'),
            capsIndicator: $('capsIndicator'),
            statusDot: $('statusDot'),
            statusLabel: $('statusLabel'),
            trackingToggle: $('trackingToggle'),
            clearBtn: $('clearBtn'),
            copyBtn: $('copyBtn'),
            video: $('video'),
            landmarkCanvas: $('landmarkCanvas'),
            fingerDot: $('fingerDot'),
            feedDot: $('feedDot'),
            feedStatus: $('feedStatus'),
            feedToggle: $('feedToggle'),
            cameraFeed: $('cameraFeed'),
            gestureBar: $('gestureBar'),
            gestureEmoji: $('gestureEmoji'),
            gestureText: $('gestureText'),
            gestureAction: $('gestureAction'),
            toast: $('toast'),
            bgCanvas: $('bgCanvas'),
            keys: document.querySelectorAll('.kb-key')
        };

        // ============================================
        // KEY MAP
        // ============================================
        const keyPositions = {};
        const keyElements = {};

        dom.keys.forEach((el) => {
            const key = el.dataset.key;
            keyElements[key] = el;
            const rect = el.getBoundingClientRect();
            keyPositions[key] = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2,
                w: rect.width,
                h: rect.height,
                el: el
            };
        });

        // ============================================
        // BACKGROUND ANIMATION
        // ============================================
        function initBackground() {
            const canvas = dom.bgCanvas;
            const ctx = canvas.getContext('2d');
            const particles = [];
            const count = 60;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: 1 + Math.random() * 2,
                    opacity: 0.1 + Math.random() * 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(102, 126, 234, ${p.opacity})`;
                    ctx.fill();
                }

                // Draw some connections
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(102, 126, 234, ${0.05 * (1 - dist / 150)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();
        }

        // ============================================
        // TEXT MANAGEMENT
        // ============================================
        function updateText() {
            const display = dom.textContent;
            const text = App.text;
            const cursor = App.cursor;

            if (text.length === 0) {
                display.innerHTML = `
                    <span class="placeholder">👆 Point at keys to type in the air</span>
                    <span class="cursor"></span>
                `;
                updateStats();
                return;
            }

            const before = text.substring(0, cursor);
            const after = text.substring(cursor);

            display.innerHTML = `${before}<span class="cursor"></span>${after}`;

            // Auto-scroll to cursor
            const cursorEl = display.querySelector('.cursor');
            if (cursorEl) {
                cursorEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            updateStats();
        }

        function insertChar(char) {
            if (App.shift) {
                const shiftMap = {
                    '1': '!',
                    '2': '@',
                    '3': '#',
                    '4': '$',
                    '5': '%',
                    '6': '^',
                    '7': '&',
                    '8': '*',
                    '9': '(',
                    '0': ')',
                    '-': '_',
                    '=': '+',
                    '[': '{',
                    ']': '}',
                    '\\': '|',
                    ';': ':',
                    "'": '"',
                    ',': '<',
                    '.': '>',
                    '/': '?',
                    '`': '~'
                };
                char = shiftMap[char] || char.toUpperCase();
                App.shift = false;
            } else if (App.capsLock && char.length === 1 && char >= 'a' && char <= 'z') {
                char = char.toUpperCase();
            }

            App.text = App.text.substring(0, App.cursor) + char + App.text.substring(App.cursor);
            App.cursor++;
            App.charCount++;

            // WPM tracking
            const now = Date.now();
            App.typingBuffer.push(now);
            if (App.typingBuffer.length > 100) App.typingBuffer.shift();

            if (App.typingBuffer.length > 1) {
                const timeDiff = (now - App.typingBuffer[0]) / 60000;
                App.wpm = Math.round((App.typingBuffer.length / 5) / timeDiff);
            }

            updateText();
            showToast(`⌨️ ${char}`);
        }

        function deleteChar() {
            if (App.cursor > 0) {
                App.text = App.text.substring(0, App.cursor - 1) + App.text.substring(App.cursor);
                App.cursor--;
                App.charCount = Math.max(0, App.charCount - 1);
                updateText();
                showToast('⌫ Deleted');
            }
        }

        function insertSpace() {
            insertChar(' ');
        }

        function insertNewline() {
            insertChar('\n');
        }

        function updateStats() {
            const text = App.text;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            App.wordCount = words;

            dom.charCount.textContent = text.length;
            dom.wordCount.textContent = words;
            dom.wpmDisplay.textContent = App.wpm || 0;
            dom.capsIndicator.textContent = App.capsLock ? '🔒' : '🔓';
        }

        function clearText() {
            App.text = '';
            App.cursor = 0;
            App.charCount = 0;
            App.typingBuffer = [];
            App.wpm = 0;
            updateText();
            showToast('🗑️ Cleared');
        }

        function copyText() {
            if (!App.text) {
                showToast('📋 Nothing to copy');
                return;
            }
            navigator.clipboard.writeText(App.text).then(() => {
                showToast('📋 Copied!');
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = App.text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast('📋 Copied!');
            });
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(msg) {
            const toast = dom.toast;
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(App.toastTimeout);
            App.toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1200);
        }

        // ============================================
        // KEYBOARD INTERACTION
        // ============================================
        function updateKeyPositions() {
            dom.keys.forEach((el) => {
                const key = el.dataset.key;
                const rect = el.getBoundingClientRect();
                if (keyPositions[key]) {
                    keyPositions[key].x = rect.left + rect.width / 2;
                    keyPositions[key].y = rect.top + rect.height / 2;
                    keyPositions[key].w = rect.width;
                    keyPositions[key].h = rect.height;
                }
            });
        }

        function highlightKey(key) {
            dom.keys.forEach(el => el.classList.remove('hover'));
            const el = keyElements[key];
            if (el) {
                el.classList.add('hover');
                // Add subtle glow to status
                dom.gestureAction.textContent = `␣ ${key}`;
                dom.gestureAction.className = 'action pointing';
            }
        }

        function clearHighlight() {
            dom.keys.forEach(el => el.classList.remove('hover'));
            App.hoverKey = null;
            dom.gestureAction.textContent = 'Idle';
            dom.gestureAction.className = 'action idle';
        }

        function activateKey(key) {
            const el = keyElements[key];
            if (el) {
                el.classList.add('active-key');
                // Ripple effect
                const ripple = document.createElement('span');
                ripple.className = 'key-ripple';
                el.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
                setTimeout(() => {
                    el.classList.remove('active-key');
                }, 300);
            }

            // Execute key action
            switch (key) {
                case 'Backspace':
                    deleteChar();
                    break;
                case 'Enter':
                    insertNewline();
                    break;
                case ' ':
                    insertSpace();
                    break;
                case 'CapsLock':
                    App.capsLock = !App.capsLock;
                    showToast(App.capsLock ? '🔒 Caps Lock ON' : '🔓 Caps Lock OFF');
                    break;
                case 'Shift':
                    App.shift = true;
                    showToast('⇧ Shift (next key)');
                    break;
                case 'Tab':
                    insertChar('\t');
                    break;
                case 'Ctrl':
                case 'Alt':
                case 'Meta':
                    break;
                case 'ArrowLeft':
                    App.cursor = Math.max(0, App.cursor - 1);
                    updateText();
                    break;
                case 'ArrowRight':
                    App.cursor = Math.min(App.text.length, App.cursor + 1);
                    updateText();
                    break;
                default:
                    insertChar(key);
                    break;
            }

            App.keyCooldown = 10;
        }

        // ============================================
        // HAND TRACKING
        // ============================================
        function detectHover(normX, normY) {
            const kbRect = document.getElementById('keyboard').getBoundingClientRect();
            const keyX = kbRect.left + normX * kbRect.width;
            const keyY = kbRect.top + (1 - normY) * kbRect.height;

            let closest = null;
            let closestDist = Infinity;

            for (const [key, pos] of Object.entries(keyPositions)) {
                const rect = pos.el.getBoundingClientRect();

                // Check if inside key
                if (keyX >= rect.left && keyX <= rect.right &&
                    keyY >= rect.top && keyY <= rect.bottom) {
                    closest = key;
                    closestDist = 0;
                    break;
                }

                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dist = Math.sqrt((keyX - cx) ** 2 + (keyY - cy) ** 2);

                if (dist < closestDist) {
                    closestDist = dist;
                    closest = key;
                }
            }

            if (closest && closestDist < 80) {
                if (App.hoverKey !== closest) {
                    App.hoverKey = closest;
                    highlightKey(closest);
                    dom.gestureAction.textContent = `␣ ${closest}`;
                    dom.gestureAction.className = 'action pointing';
                }
            } else {
                clearHighlight();
            }
        }

        function onHandResults(results) {
            if (!App.isTracking) return;

            const lcCtx = dom.landmarkCanvas.getContext('2d');
            const w = dom.video.videoWidth || 640;
            const h = dom.video.videoHeight || 480;
            dom.landmarkCanvas.width = w;
            dom.landmarkCanvas.height = h;

            lcCtx.clearRect(0, 0, w, h);
            lcCtx.drawImage(dom.video, 0, 0, w, h);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                App.handDetected = true;
                const lm = results.multiHandLandmarks[0];

                // Draw landmarks
                const du = window;
                du.drawConnectors(lcCtx, lm, du.HAND_CONNECTIONS, {
                    color: '#00FF00',
                    lineWidth: 1.5
                });
                du.drawLandmarks(lcCtx, lm, { color: '#FF0000', lineWidth: 1 });

                // Get index finger tip
                const tip = lm[8];
                const rawX = tip.x * w;
                const rawY = tip.y * h;

                // Apply Kalman filter
                const filtered = App.filter.update(rawX, rawY);
                const normX = filtered.x / w;
                const normY = filtered.y / h;

                App.handX = normX;
                App.handY = normY;

                // Gesture detection
                const tips = [8, 12, 16, 20];
                const joints = [6, 10, 14, 18];
                let folded = 0;
                for (let i = 0; i < tips.length; i++) {
                    if (lm[tips[i]].y > lm[joints[i]].y) folded++;
                }
                App.isFist = folded >= 3;

                // Pointing gesture
                App.isPointing = !App.isFist &&
                    lm[8].y < lm[6].y &&
                    lm[12].y > lm[10].y &&
                    lm[16].y > lm[14].y &&
                    lm[20].y > lm[18].y;

                // Update finger dot
                const feedRect = dom.cameraFeed.getBoundingClientRect();
                const dotX = normX * feedRect.width;
                const dotY = (1 - normY) * feedRect.height;
                const dot = dom.fingerDot;
                dot.style.left = dotX + 'px';
                dot.style.top = dotY + 'px';
                dot.style.display = 'block';
                dot.style.borderColor = App.isFist ? '#ef4444' : '#4ade80';
                dot.style.background = App.isFist ? 'rgba(239,68,68,0.2)' : 'rgba(74,222,128,0.2)';

                // Update status
                dom.feedDot.className = 'dot on';
                dom.feedStatus.textContent = App.isFist ? '✊' : App.isPointing ? '☝️' : '🖐️';

                // Hover detection
                if (App.isPointing) {
                    detectHover(normX, normY);
                } else {
                    clearHighlight();
                }

                // Click (fist)
                if (App.isFist && App.hoverKey && App.keyCooldown === 0) {
                    activateKey(App.hoverKey);
                }

                // Cooldown
                if (App.keyCooldown > 0) App.keyCooldown--;

                // Update gesture bar
                updateGestureBar();

            } else {
                App.handDetected = false;
                App.isFist = false;
                App.isPointing = false;
                dom.fingerDot.style.display = 'none';
                dom.feedDot.className = 'dot off';
                dom.feedStatus.textContent = 'Off';
                clearHighlight();
                updateGestureBar();
            }

            dom.landmarkCanvas.style.display = 'block';
            dom.video.style.display = 'none';
        }

        // ============================================
        // GESTURE BAR
        // ============================================
        function updateGestureBar() {
            const bar = dom.gestureBar;

            if (!App.isTracking) {
                bar.classList.remove('show');
                return;
            }

            if (!App.handDetected) {
                bar.classList.remove('show');
                return;
            }

            bar.classList.add('show');

            let emoji = '🖐️';
            let text = 'Hover over a key to select it';

            if (App.isFist) {
                emoji = '✊';
                text = App.hoverKey ? `Clicking: ${App.hoverKey}` : 'Make a fist to click';
            } else if (App.isPointing) {
                emoji = '☝️';
                text = App.hoverKey ? `Selecting: ${App.hoverKey}` : 'Point at a key';
            } else {
                emoji = '🖐️';
                text = 'Extend your index finger to type';
            }

            dom.gestureEmoji.textContent = emoji;
            dom.gestureText.innerHTML = text;

            if (App.isFist && App.hoverKey) {
                dom.gestureAction.textContent = '␣ Click!';
                dom.gestureAction.className = 'action clicking';
            } else if (App.isPointing && App.hoverKey) {
                dom.gestureAction.textContent = `␣ ${App.hoverKey}`;
                dom.gestureAction.className = 'action pointing';
            } else {
                dom.gestureAction.textContent = 'Idle';
                dom.gestureAction.className = 'action idle';
            }
        }

        // ============================================
        // CAMERA SETUP
        // ============================================
        let cameraInstance = null;
        let handsInstance = null;

        async function startTracking() {
            try {
                App.isTracking = true;
                dom.trackingToggle.textContent = '⏹️ Stop';
                dom.trackingToggle.className = 'header-btn';
                dom.statusDot.className = 'status-dot on';
                dom.statusLabel.textContent = 'Active';

                if (typeof Hands === 'undefined') {
                    throw new Error('MediaPipe not loaded');
                }

                handsInstance = new Hands({
                    locateFile: (file) =>
                        `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
                });

                handsInstance.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5
                });

                handsInstance.onResults(onHandResults);

                cameraInstance = new Camera(dom.video, {
                    onFrame: async () => {
                        try { await handsInstance.send({ image: dom.video }); } catch (e) {}
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'user'
                });

                await cameraInstance.start();
                showToast('✅ Camera started');

            } catch (err) {
                console.error('Tracking error:', err);
                App.isTracking = false;
                dom.trackingToggle.textContent = '🖐️ Retry';
                dom.trackingToggle.className = 'header-btn primary';
                dom.statusDot.className = 'status-dot off';
                dom.statusLabel.textContent = 'Error';
                showToast('❌ Camera error: ' + err.message);
            }
        }

        function stopTracking() {
            App.isTracking = false;
            App.filter.reset();

            if (cameraInstance) {
                try { cameraInstance.stop(); } catch (e) {}
                cameraInstance = null;
            }
            if (handsInstance) {
                try { handsInstance.close(); } catch (e) {}
                handsInstance = null;
            }

            dom.video.style.display = 'none';
            dom.landmarkCanvas.style.display = 'none';
            dom.fingerDot.style.display = 'none';
            dom.feedDot.className = 'dot off';
            dom.feedStatus.textContent = 'Off';

            dom.trackingToggle.textContent = '🖐️ Start';
            dom.trackingToggle.className = 'header-btn primary';
            dom.statusDot.className = 'status-dot off';
            dom.statusLabel.textContent = 'Offline';
            dom.gestureBar.classList.remove('show');

            showToast('⏹️ Tracking stopped');
        }

        // ============================================
        // UI EVENTS
        // ============================================
        // Keyboard clicks (mouse fallback)
        dom.keys.forEach(key => {
            key.addEventListener('click', () => {
                activateKey(key.dataset.key);
            });

            key.addEventListener('touchstart', (e) => {
                e.preventDefault();
                activateKey(key.dataset.key);
            });
        });

        // Header buttons
        dom.trackingToggle.addEventListener('click', () => {
            if (App.isTracking) {
                stopTracking();
            } else {
                startTracking();
            }
        });

        dom.clearBtn.addEventListener('click', clearText);
        dom.copyBtn.addEventListener('click', copyText);

        // Feed toggle (minimize)
        let feedMinimized = false;
        dom.feedToggle.addEventListener('click', () => {
            feedMinimized = !feedMinimized;
            dom.cameraFeed.classList.toggle('minimized');
            dom.feedToggle.textContent = feedMinimized ? '+' : '−';
        });

        // Click feed to toggle
        dom.cameraFeed.addEventListener('click', (e) => {
            if (e.target === dom.feedToggle) return;
            feedMinimized = !feedMinimized;
            dom.cameraFeed.classList.toggle('minimized');
            dom.feedToggle.textContent = feedMinimized ? '+' : '−';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const key = e.key;

            if (key === 'Backspace') { deleteChar();
                e.preventDefault(); return; }
            if (key === 'Enter') { insertNewline();
                e.preventDefault(); return; }
            if (key === ' ') { insertSpace();
                e.preventDefault(); return; }
            if (key === 'Escape') {
                if (App.isTracking) stopTracking();
                else startTracking();
                e.preventDefault();
                return;
            }

            if (key === 'CapsLock') {
                App.capsLock = !App.capsLock;
                showToast(App.capsLock ? '🔒 Caps Lock ON' : '🔓 Caps Lock OFF');
                e.preventDefault();
                return;
            }

            if (key === 'Shift') {
                App.shift = true;
                e.preventDefault();
                return;
            }

            if (key === 'ArrowLeft') {
                App.cursor = Math.max(0, App.cursor - 1);
                updateText();
                e.preventDefault();
                return;
            }
            if (key === 'ArrowRight') {
                App.cursor = Math.min(App.text.length, App.cursor + 1);
                updateText();
                e.preventDefault();
                return;
            }

            if (key.length === 1) {
                insertChar(key);
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Shift') App.shift = false;
        });

        // ============================================
        // WINDOW EVENTS
        // ============================================
        window.addEventListener('resize', () => {
            setTimeout(updateKeyPositions, 200);
        });

        // Update key positions periodically
        setInterval(updateKeyPositions, 3000);

        // ============================================
        // PWA
        // ============================================
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // ============================================
        // INIT
        // ============================================
        initBackground();
        updateText();
        updateKeyPositions();

        // Auto-start after 1s
        setTimeout(() => {
            startTracking();
        }, 1000);

        console.log('⌨️ AirType Pro initialized');
        console.log('📋 Senior Dev Quality');
        console.log('🖐️ Point at keys to type in the air');
    </script>
</body>
</html>
