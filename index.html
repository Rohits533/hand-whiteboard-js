<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        /* ============================================
           COMPLETE JARVIS STYLE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --jarvis-blue: #00d4ff;
            --jarvis-dark: #0a0a1a;
            --jarvis-glow: rgba(0, 212, 255, 0.3);
            --jarvis-accent: #00ff88;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a1a;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ============================================
           ANIMATED BACKGROUND
           ============================================ */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
        }

        /* ============================================
           JARVIS MAIN CONTAINER
           ============================================ */
        #jarvis {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            font-weight: 300;
            opacity: 0.5;
            -webkit-text-fill-color: rgba(255,255,255,0.3);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }

        .status-dot.on {
            background: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
        }

        .status-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-jarvis {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-jarvis:hover {
            background: rgba(0, 212, 255, 0.1);
            color: white;
            transform: scale(1.02);
        }

        .btn-jarvis.primary {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
        }

        .btn-jarvis.primary:hover {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            transform: scale(1.05);
        }

        /* ============================================
           JARVIS CIRCLE (Iron Man Style)
           ============================================ */
        .jarvis-circle-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 0;
        }

        .jarvis-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Outer ring */
        .jarvis-circle::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #00d4ff, transparent, #0066ff, transparent);
            animation: spin-ring 8s linear infinite;
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        }

        @keyframes spin-ring {
            to { transform: rotate(360deg); }
        }

        /* Inner glow */
        .jarvis-circle::after {
            content: '';
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1), transparent 70%);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .jarvis-avatar {
            position: relative;
            z-index: 5;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #1a1a3e, #0a0a1a);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .jarvis-avatar .icon {
            font-size: 4rem;
            margin-bottom: 4px;
        }

        .jarvis-avatar .name {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
        }

        .jarvis-avatar .status {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            font-weight: 400;
        }

        /* Speaking animation */
        .speaking .jarvis-avatar::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00d4ff;
            border-bottom-color: #0066ff;
            animation: spin-speak 0.8s linear infinite;
        }

        @keyframes spin-speak {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           VOICE WAVES
           ============================================ */
        .voice-waves {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            align-items: center;
            height: 30px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .voice-waves.active {
            opacity: 1;
        }

        .voice-waves .wave {
            width: 3px;
            background: #00d4ff;
            border-radius: 10px;
            animation: wave 0.6s ease-in-out infinite alternate;
        }

        .voice-waves .wave:nth-child(1) { height: 8px; animation-delay: 0s; }
        .voice-waves .wave:nth-child(2) { height: 16px; animation-delay: 0.1s; }
        .voice-waves .wave:nth-child(3) { height: 24px; animation-delay: 0.2s; }
        .voice-waves .wave:nth-child(4) { height: 28px; animation-delay: 0.3s; }
        .voice-waves .wave:nth-child(5) { height: 24px; animation-delay: 0.4s; }
        .voice-waves .wave:nth-child(6) { height: 16px; animation-delay: 0.5s; }
        .voice-waves .wave:nth-child(7) { height: 8px; animation-delay: 0.6s; }

        @keyframes wave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        /* ============================================
           BOTTOM PANEL
           ============================================ */
        .bottom-panel {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin: 0 -20px;
            padding: 16px 20px 0;
        }

        .panel-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
            min-height: 80px;
        }

        .panel-card .card-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .panel-card .card-content {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.5;
        }

        .panel-card .card-content .highlight {
            color: #00d4ff;
            font-weight: 600;
        }

        .panel-card .card-content .accent {
            color: #00ff88;
            font-weight: 600;
        }

        /* Weather specific */
        .weather-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .weather-item .temp {
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }

        .weather-item .desc {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* ============================================
           CHAT/COMMAND INPUT
           ============================================ */
        .command-bar {
            flex-shrink: 0;
            display: flex;
            gap: 12px;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin: 0 -20px;
            padding: 12px 20px 0;
        }

        .command-bar input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .command-bar input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .command-bar input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .command-bar .mic-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.2rem;
        }

        .command-bar .mic-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.05);
        }

        .command-bar .mic-btn.active {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
            50% { box-shadow: 0 0 60px rgba(0, 212, 255, 0.6); }
        }

        .command-bar .send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .command-bar .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        /* ============================================
           TOAST / RESPONSE
           ============================================ */
        #responseToast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.1);
            color: white;
            font-size: 1rem;
            max-width: 500px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #responseToast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #responseToast .toast-icon {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 6px;
        }

        #responseToast .toast-text {
            line-height: 1.5;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1024px) {
            .bottom-panel {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .jarvis-circle {
                width: 220px;
                height: 220px;
            }

            .jarvis-avatar {
                width: 160px;
                height: 160px;
            }

            .jarvis-avatar .icon {
                font-size: 2.5rem;
            }

            .bottom-panel {
                grid-template-columns: 1fr;
                padding: 8px 16px;
            }

            .header {
                padding: 8px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .logo-text {
                font-size: 1rem;
            }

            .command-bar {
                flex-wrap: wrap;
            }

            .command-bar input {
                flex: 1 1 100%;
                order: 1;
            }

            .command-bar .mic-btn {
                order: 2;
                flex: 1;
            }

            .command-bar .send-btn {
                order: 3;
                flex: 1;
            }

            #responseToast {
                max-width: 90%;
                font-size: 0.85rem;
                padding: 12px 20px;
                bottom: 100px;
            }
        }

        @media (max-width: 480px) {
            .jarvis-circle {
                width: 160px;
                height: 160px;
            }

            .jarvis-avatar {
                width: 120px;
                height: 120px;
            }

            .jarvis-avatar .icon {
                font-size: 2rem;
            }

            .jarvis-avatar .name {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <canvas id="bgCanvas"></canvas>

    <!-- JARVIS Container -->
    <div id="jarvis">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">J</div>
                <span class="logo-text">JARVIS <span>AI</span></span>
            </div>

            <div style="display:flex; align-items:center; gap:12px;">
                <div class="status-badge">
                    <span class="status-dot on"></span>
                    <span class="status-text" id="statusText">Ready</span>
                </div>
                <button class="btn-jarvis primary" id="toggleCamera">📸 Camera</button>
                <button class="btn-jarvis" id="clearHistory">🗑️ Clear</button>
            </div>
        </header>

        <!-- Jarvis Circle -->
        <div class="jarvis-circle-container">
            <div class="jarvis-circle" id="jarvisCircle">
                <div class="jarvis-avatar" id="jarvisAvatar">
                    <div class="icon">🤖</div>
                    <div class="name">J.A.R.V.I.S.</div>
                    <div class="status" id="avatarStatus">Online</div>
                </div>

                <div class="voice-waves" id="voiceWaves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Panel -->
        <div class="bottom-panel">
            <div class="panel-card">
                <div class="card-label">📊 System Status</div>
                <div class="card-content" id="systemStatus">
                    Memory: <span class="highlight">3.2 GB</span> used<br />
                    CPU: <span class="accent">12%</span>
                </div>
            </div>

            <div class="panel-card">
                <div class="card-label">🌤️ Weather</div>
                <div class="card-content" id="weatherDisplay">
                    <div class="weather-item">
                        <span style="font-size:1.5rem;">☀️</span>
                        <span class="temp">72°F</span>
                        <span class="desc">Sunny</span>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <div class="card-label">👤 User</div>
                <div class="card-content" id="userDisplay">
                    <span id="userName">Guest</span>
                    <span style="opacity:0.4;font-size:0.7rem;display:block;" id="userMood">Mood: Neutral</span>
                </div>
            </div>
        </div>

        <!-- Command Bar -->
        <div class="command-bar">
            <input type="text" id="commandInput" placeholder="Type a command or ask something..." />
            <button class="mic-btn" id="micBtn">🎙️</button>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Response Toast -->
    <div id="responseToast">
        <span class="toast-icon" id="toastIcon">🤖</span>
        <div class="toast-text" id="toastText">Hello! I'm JARVIS. How can I help you today?</div>
    </div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script>
        // ============================================
        // JARVIS: COMPLETE AI ASSISTANT
        // ============================================

        // ===== CONFIG =====
        const CONFIG = {
            // Get your API key from: https://platform.openai.com/api-keys
            OPENAI_API_KEY: 'YOUR_OPENAI_API_KEY_HERE',
            WEATHER_API_KEY: 'YOUR_WEATHER_API_KEY_HERE',
            // For free alternative, you can use: https://api.openai.com/v1/chat/completions
            USE_MOCK_RESPONSES: true // Set to false if you have API key
        };

        // ===== STATE =====
        const state = {
            isListening: false,
            isSpeaking: false,
            userName: 'Guest',
            userMood: 'neutral',
            recognized: false,
            history: [],
            weather: { temp: 72, condition: 'Sunny', icon: '☀️' },
            lastResponse: '',
            faceDetected: false
        };

        // ===== DOM REFS =====
        const $ = id => document.getElementById(id);

        const dom = {
            commandInput: $('commandInput'),
            sendBtn: $('sendBtn'),
            micBtn: $('micBtn'),
            toast: $('responseToast'),
            toastIcon: $('toastIcon'),
            toastText: $('toastText'),
            statusText: $('statusText'),
            avatarStatus: $('avatarStatus'),
            jarvisCircle: $('jarvisCircle'),
            voiceWaves: $('voiceWaves'),
            userName: $('userName'),
            userMood: $('userMood'),
            weatherDisplay: $('weatherDisplay'),
            systemStatus: $('systemStatus'),
            toggleCamera: $('toggleCamera'),
            clearHistory: $('clearHistory')
        };

        // ============================================
        // BACKGROUND ANIMATION
        // ============================================
        function initBackground() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            const particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    size: 1 + Math.random() * 2,
                    opacity: 0.2 + Math.random() * 0.3
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 212, 255, ${p.opacity})`;
                    ctx.fill();
                }

                // Connections
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 212, 255, ${0.03 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();
        }

        // ============================================
        // FACE DETECTION (Camera)
        // ============================================
        let faceDetector = null;
        let videoStream = null;

        async function initFaceDetection() {
            try {
                const video = document.createElement('video');
                video.style.display = 'none';
                document.body.appendChild(video);

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 320, height: 240 }
                });
                videoStream = stream;
                video.srcObject = stream;
                await video.play();

                // Load face-api (simplified - using built-in face detection)
                // For simplicity, we'll use a mock face detection
                dom.statusText.textContent = 'Face scanning';
                dom.avatarStatus.textContent = 'Scanning...';

                // Simulate face detection
                setTimeout(() => {
                    state.recognized = true;
                    state.userName = 'User';
                    dom.userName.textContent = state.userName;
                    dom.statusText.textContent = 'Face recognized';
                    dom.avatarStatus.textContent = 'Welcome back!';
                    showToast('👤 Face recognized', `Welcome back, ${state.userName}!`);
                    dom.toggleCamera.textContent = '📸 On';
                }, 2000);

                return true;

            } catch (err) {
                console.log('Camera not available:', err);
                dom.statusText.textContent = 'Camera off';
                dom.avatarStatus.textContent = 'Camera off';
                return false;
            }
        }

        function stopFaceDetection() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            dom.toggleCamera.textContent = '📸 Camera';
            dom.statusText.textContent = 'Ready';
            dom.avatarStatus.textContent = 'Online';
            state.recognized = false;
            dom.userName.textContent = 'Guest';
        }

        // ============================================
        // WEATHER (Mock)
        // ============================================
        function updateWeather() {
            const conditions = [
                { temp: 68 + Math.floor(Math.random() * 20), condition: 'Sunny', icon: '☀️' },
                { temp: 55 + Math.floor(Math.random() * 15), condition: 'Cloudy', icon: '☁️' },
                { temp: 40 + Math.floor(Math.random() * 10), condition: 'Rainy', icon: '🌧️' },
                { temp: 65 + Math.floor(Math.random() * 15), condition: 'Partly Cloudy', icon: '⛅' }
            ];
            const weather = conditions[Math.floor(Math.random() * conditions.length)];
            state.weather = weather;

            dom.weatherDisplay.innerHTML = `
                <div class="weather-item">
                    <span style="font-size:1.5rem;">${weather.icon}</span>
                    <span class="temp">${weather.temp}°F</span>
                    <span class="desc">${weather.condition}</span>
                </div>
            `;
        }

        // ============================================
        // SYSTEM STATUS
        // ============================================
        function updateSystemStatus() {
            const mem = (3.2 + Math.random() * 0.5).toFixed(1);
            const cpu = (8 + Math.random() * 15).toFixed(1);
            dom.systemStatus.innerHTML = `
                Memory: <span class="highlight">${mem} GB</span> used<br />
                CPU: <span class="accent">${cpu}%</span>
            `;
        }

        // ============================================
        // RESPONSE GENERATION
        // ============================================
        function generateResponse(input) {
            const lower = input.toLowerCase().trim();

            // Greetings
            if (lower.match(/hello|hi|hey|sup|yo/i)) {
                return { icon: '👋', text: `Hello ${state.userName}! How can I assist you today?` };
            }

            if (lower.match(/how are you|how're you|how u doing/i)) {
                return { icon: '😊', text: "I'm functioning optimally, thank you! How are you feeling today?" };
            }

            if (lower.match(/name|who are you|what are you/i)) {
                return { icon: '🤖', text: "I'm JARVIS - Just A Rather Very Intelligent System. I'm your personal AI assistant." };
            }

            // Weather
            if (lower.match(/weather|temperature|forecast|rain|sunny|hot|cold/i)) {
                return { icon: state.weather.icon,
                text: `The weather is currently ${state.weather.condition} with a temperature of ${state.weather.temp}°F. ${state.weather.temp > 70 ? 'Nice weather!' : 'Might need a jacket!'}` };
            }

            // Time
            if (lower.match(/time|clock|what time/i)) {
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                return { icon: '🕐', text: `The current time is ${time}. Is there anything else you need?` };
            }

            // Date
            if (lower.match(/date|today|day|month|year/i)) {
                const now = new Date();
                const date = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long',
                    day: 'numeric' });
                return { icon: '📅', text: `Today is ${date}.` };
            }

            // Jokes
            if (lower.match(/joke|funny|laugh/i)) {
                const jokes = [
                    "Why do programmers prefer dark mode? Because light attracts bugs!",
                    "Why did the developer go broke? Because he used up all his cache!",
                    "What's a computer's favorite snack? Microchips!",
                    "Why do Java developers wear glasses? Because they can't C#!"
                ];
                return { icon: '😂', text: jokes[Math.floor(Math.random() * jokes.length)] };
            }

            // Smart home (mock)
            if (lower.match(/light|lights|turn on|turn off|dim|bright/i)) {
                const action = lower.match(/on|off|dim|bright|toggle/i) ? lower.match(/on|off|dim|bright|toggle/i)[0] :
                    'toggle';
                return { icon: '💡', text: `I've ${action === 'on' ? 'turned on' : action === 'off' ? 'turned off' : 'adjusted'} the lights in your ${Math.random() > 0.5 ? 'living room' : 'office'}.` };
            }

            // Music
            if (lower.match(/play|music|song|spotify|listen|audio/i)) {
                const songs = ["Bohemian Rhapsody", "Shape of You", "Blinding Lights", "Dance Monkey", "Levitating"];
                return { icon: '🎵', text: `Playing "${songs[Math.floor(Math.random() * songs.length)]}" on your preferred device.` };
            }

            // News
            if (lower.match(/news|headlines|update|what's happening|current events/i)) {
                return { icon: '📰', text: "Here are today's top headlines: 1) Tech stocks rally, 2) New AI breakthrough announced, 3) Weather update: mostly sunny. Would you like more details?" };
            }

            // Goodbye
            if (lower.match(/bye|goodbye|see you|exit|quit|cya|later/i)) {
                return { icon: '👋', text: `Goodbye ${state.userName}! I'll be here whenever you need me. Have a great day!` };
            }

            // Help
            if (lower.match(/help|assist|what can|commands|support|guide/i)) {
                return { icon: '🆘', text: `Here's what I can do: Say "hello", ask about weather, time, date, tell a joke, control lights, play music, get news, ask "how are you", or say "bye". What would you like to do?` };
            }

            // Unknown
            if (CONFIG.USE_MOCK_RESPONSES) {
                const fallbacks = [
                    "That's interesting! Tell me more about that.",
                    "I'm still learning. Could you rephrase that?",
                    "I understand you're curious. Let me think about that.",
                    "Good question! I'm processing that right now.",
                    "I'm not sure about that yet. I'm constantly learning!"
                ];
                return { icon: '🤔', text: fallbacks[Math.floor(Math.random() * fallbacks.length)] };
            }

            // AI-powered response (if API key provided)
            return {
                icon: '🧠',
                text: "I'm thinking about that. For now, try asking me about weather, time, jokes, or smart home control!"
            };
        }

        // ============================================
        // TOAST / RESPONSE DISPLAY
        // ============================================
        let toastTimeout = null;

        function showToast(icon, text) {
            dom.toastIcon.textContent = icon || '🤖';
            dom.toastText.textContent = text || 'Processing...';
            dom.toast.classList.add('show');
            clearTimeout(toastTimeout);

            // Auto-hide after 5 seconds or if it's a question
            const autoHide = !text.includes('?') && !text.includes('what') && !text.includes('how');
            toastTimeout = setTimeout(() => {
                dom.toast.classList.remove('show');
            }, autoHide ? 5000 : 8000);
        }

        function hideToast() {
            dom.toast.classList.remove('show');
            clearTimeout(toastTimeout);
        }

        // ============================================
        // SPEECH SYNTHESIS
        // ============================================
        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.voice = speechSynthesis.getVoices().find(v => v.lang.includes('en-US')) || null;

                state.isSpeaking = true;
                dom.avatarStatus.textContent = 'Speaking...';
                dom.jarvisCircle.classList.add('speaking');
                dom.voiceWaves.classList.add('active');

                utterance.onend = () => {
                    state.isSpeaking = false;
                    dom.avatarStatus.textContent = 'Online';
                    dom.jarvisCircle.classList.remove('speaking');
                    dom.voiceWaves.classList.remove('active');
                };

                speechSynthesis.speak(utterance);
            }
        }

        // ============================================
        // SPEECH RECOGNITION
        // ============================================
        let recognition = null;

        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    dom.commandInput.value = text;
                    state.isListening = false;
                    dom.micBtn.classList.remove('active');
                    dom.micBtn.textContent = '🎙️';
                    dom.statusText.textContent = 'Processing voice';
                    dom.avatarStatus.textContent = 'Listening...';
                    dom.voiceWaves.classList.remove('active');

                    // Process the command
                    processCommand(text);
                };

                recognition.onerror = (event) => {
                    console.log('Speech error:', event.error);
                    state.isListening = false;
                    dom.micBtn.classList.remove('active');
                    dom.micBtn.textContent = '🎙️';
                    dom.statusText.textContent = 'Error listening';
                    dom.avatarStatus.textContent = 'Online';
                    dom.voiceWaves.classList.remove('active');

                    if (event.error === 'not-allowed') {
                        showToast('❌', 'Microphone access denied. Please allow microphone access.');
                    } else {
                        showToast('❌', 'Could not hear you. Please try again.');
                    }
                };

                recognition.onend = () => {
                    state.isListening = false;
                    dom.micBtn.classList.remove('active');
                    dom.micBtn.textContent = '🎙️';
                    dom.voiceWaves.classList.remove('active');
                    if (dom.statusText.textContent === 'Listening...') {
                        dom.statusText.textContent = 'Ready';
                    }
                };

                return true;
            }
            return false;
        }

        function startListening() {
            if (state.isListening) {
                recognition.stop();
                state.isListening = false;
                dom.micBtn.classList.remove('active');
                dom.micBtn.textContent = '🎙️';
                dom.voiceWaves.classList.remove('active');
                return;
            }

            if (!recognition) {
                if (!initSpeechRecognition()) {
                    showToast('❌', 'Speech recognition not supported in this browser.');
                    return;
                }
            }

            try {
                state.isListening = true;
                dom.micBtn.classList.add('active');
                dom.micBtn.textContent = '⏹️';
                dom.statusText.textContent = 'Listening...';
                dom.avatarStatus.textContent = '🎤 Listening';
                dom.voiceWaves.classList.add('active');
                recognition.start();
            } catch (err) {
                console.log('Speech error:', err);
                state.isListening = false;
                dom.micBtn.classList.remove('active');
                dom.micBtn.textContent = '🎙️';
                dom.voiceWaves.classList.remove('active');
            }
        }

        // ============================================
        // COMMAND PROCESSING
        // ============================================
        function processCommand(input) {
            if (!input || input.trim().length === 0) return;

            // Show typing indicator
            dom.statusText.textContent = 'Thinking...';
            dom.avatarStatus.textContent = '🧠 Processing';

            // Generate response
            const response = generateResponse(input);

            // Update history
            state.history.push({ input, response: response.text, timestamp: new Date() });
            state.lastResponse = response.text;

            // Show response
            showToast(response.icon, response.text);

            // Speak response
            setTimeout(() => {
                speak(response.text);
            }, 500);

            dom.statusText.textContent = 'Ready';
            dom.avatarStatus.textContent = 'Online';
            dom.commandInput.value = '';
            dom.commandInput.focus();

            // Update user mood based on input
            if (input.match(/happy|great|awesome|good|wonderful|amazing|excellent/i)) {
                state.userMood = 'happy';
                dom.userMood.textContent = 'Mood: 😊 Happy';
            } else if (input.match(/sad|bad|terrible|awful|depressed|upset/i)) {
                state.userMood = 'sad';
                dom.userMood.textContent = 'Mood: 😔 Sad';
            } else if (input.match(/tired|sleepy|exhausted|fatigue/i)) {
                state.userMood = 'tired';
                dom.userMood.textContent = 'Mood: 😴 Tired';
            } else if (input.match(/angry|frustrated|annoyed|mad/i)) {
                state.userMood = 'angry';
                dom.userMood.textContent = 'Mood: 😡 Angry';
            } else {
                dom.userMood.textContent = 'Mood: 😐 Neutral';
            }

            // Update user name if introduced
            const nameMatch = input.match(/my name is (\w+)|i am (\w+)|call me (\w+)/i);
            if (nameMatch) {
                const name = nameMatch[1] || nameMatch[2] || nameMatch[3];
                state.userName = name;
                dom.userName.textContent = name;
                showToast('👤', `Nice to meet you, ${name}! I'll remember that.`);
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        // Send button
        dom.sendBtn.addEventListener('click', () => {
            const input = dom.commandInput.value.trim();
            if (input) processCommand(input);
        });

        // Enter key
        dom.commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const input = dom.commandInput.value.trim();
                if (input) processCommand(input);
            }
        });

        // Mic button
        dom.micBtn.addEventListener('click', startListening);

        // Camera toggle
        dom.toggleCamera.addEventListener('click', () => {
            if (dom.toggleCamera.textContent === '📸 Camera') {
                initFaceDetection();
            } else {
                stopFaceDetection();
                dom.toggleCamera.textContent = '📸 Camera';
            }
        });

        // Clear history
        dom.clearHistory.addEventListener('click', () => {
            state.history = [];
            showToast('🗑️', 'History cleared.');
        });

        // Click on toast to dismiss
        dom.toast.addEventListener('click', hideToast);

        // ============================================
        // MOCK AI RESPONSE (for demo)
        // ============================================

        // ============================================
        // INIT
        // ============================================
        function init() {
            initBackground();
            updateWeather();
            updateSystemStatus();

            // Auto-start with greeting
            setTimeout(() => {
                showToast('🤖', 'Hello! I\'m JARVIS. How can I help you today?');
                speak('Hello! I\'m JARVIS. How can I help you today?');
            }, 1000);

            // Set up speech voices
            if ('speechSynthesis' in window) {
                speechSynthesis.getVoices();
                speechSynthesis.onvoiceschanged = () => {
                    speechSynthesis.getVoices();
                };
            }

            // Init speech recognition
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                initSpeechRecognition();
            } else {
                dom.micBtn.style.opacity = '0.5';
                dom.micBtn.title = 'Speech recognition not supported';
            }

            // Update status periodically
            setInterval(() => {
                updateSystemStatus();
                if (Math.random() > 0.7) {
                    // Occasionally change weather for demo
                    updateWeather();
                }
            }, 30000);

            console.log('🤖 JARVIS initialized');
            console.log('📸 Camera: Click "Camera" to enable face recognition');
            console.log('🎤 Click the mic to speak');
            console.log('⌨️ Type commands or ask questions');
        }

        // Start everything
        init();
    </script>
