<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🖐️ Hand Tracking Whiteboard + Subway Surfers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            max-width: 1400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.8rem;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .header-controls button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn-whiteboard {
            background: #4CAF50;
            color: white;
        }

        .btn-game {
            background: #f44336;
            color: white;
        }

        .btn-whiteboard.active {
            background: #66bb6a;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .btn-game.active {
            background: #ef5350;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.3);
        }

        .header-controls button:hover {
            transform: scale(1.05);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 20px;
        }

        /* ===== WHITEBOARD ===== */
        .whiteboard-section {
            display: block;
        }

        .whiteboard-section.hidden {
            display: none;
        }

        .drawing-area {
            background: #16213e;
            border: 3px solid #2a3a6e;
            border-radius: 15px;
            padding: 15px;
        }

        #canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            background: white;
            touch-action: none;
            cursor: crosshair;
        }

        .camera-feed {
            background: #16213e;
            border: 3px solid #2a3a6e;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
        }

        #video {
            width: 100%;
            border-radius: 10px;
            transform: scaleX(-1);
            display: none;
        }

        #landmarkCanvas {
            width: 100%;
            border-radius: 10px;
            display: none;
        }

        .status {
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .status-idle {
            background: #fef3c7;
            color: #92400e;
        }

        .status-drawing {
            background: #d1fae5;
            color: #065f46;
        }

        .status-paused {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-tracking {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .controls {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            height: fit-content;
            border: 3px solid #2a3a6e;
        }

        .controls h3 {
            color: white;
            margin-bottom: 15px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 5px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #colorPicker {
            width: 50px;
            height: 50px;
            border: 2px solid #2a3a6e;
            border-radius: 10px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        #brushSize {
            width: 100%;
            accent-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }

        .btn-success:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .shape-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
        }

        .shape-btn {
            padding: 6px;
            border: 2px solid #2a3a6e;
            border-radius: 8px;
            background: #0a0a1a;
            color: #aaa;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s;
        }

        .shape-btn.active {
            border-color: #667eea;
            background: #1a2a5e;
            color: white;
        }

        .shape-btn:hover {
            border-color: #667eea;
            color: white;
        }

        .smoothness-badge {
            display: inline-block;
            background: #22c55e;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== GAME ===== */
        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .game-container {
            background: #0a0a1a;
            border: 3px solid #2a3a6e;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        #gameCanvas {
            width: 100%;
            height: auto;
            display: block;
            background: #1a1a3e;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .game-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .game-overlay h1 {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .game-overlay p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .game-overlay .btn {
            width: auto;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .game-overlay .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: #0a0a1a;
            border-bottom: 2px solid #2a3a6e;
            color: white;
        }

        .game-stats span {
            font-size: 1.1rem;
        }

        .game-stats .score {
            color: #fbbf24;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .game-stats .high-score {
            color: #34d399;
            font-size: 1rem;
        }

        .game-controls {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            background: #0a0a1a;
            border-top: 2px solid #2a3a6e;
            flex-wrap: wrap;
        }

        .game-controls .btn {
            flex: 1;
            min-width: 60px;
            font-size: 0.8rem;
            padding: 8px;
            margin: 0;
        }

        .game-gesture-hint {
            display: flex;
            gap: 15px;
            padding: 10px 15px;
            background: #0a0a1a;
            border-top: 1px solid #2a3a6e;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-gesture-hint .hint {
            color: #888;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-gesture-hint .hint .emoji {
            font-size: 1.2rem;
        }

        .game-gesture-hint .hint .key {
            color: #fbbf24;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .header-controls button {
                font-size: 0.7rem;
                padding: 6px 12px;
            }

            .game-overlay h1 {
                font-size: 2.5rem;
            }

            .game-stats span {
                font-size: 0.9rem;
            }

            .game-gesture-hint .hint {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖐️ Hand Tracking Studio</h1>
            <div class="header-controls">
                <button id="modeWhiteboard" class="btn-whiteboard active">✏️ Whiteboard</button>

                        <span class="hint"><span class="emoji">👈</span> Left <span class="key">(Hand left)</span></span>
                        <span class="hint"><span class="emoji">👉</span> Right <span class="key">(Hand right)</span></span>

            <!-- CONTROLS SIDEBAR -->

                </div>

                <hr style="border-color: #2a3a6e; margin: 15px 0;" />

                <button id="undoBtn" class="btn btn-success">↩️ Undo</button>
                <button id="redoBtn" class="btn btn-success">↪️ Redo</button>

                <hr style="border-color: #2a3a6e; margin: 15px 0;" />

                <button id="downloadBtn" class="btn btn-primary">💾 Download PNG</button>

                <hr style="border-color: #2a3a6e; margin: 15px 0;" />

                <div style="color:#666; font-size:0.8rem; text-align:center;">
                    <span style="color:#888;">🔄 Kalman Filter <span class="smoothness-badge">Pro</span></span>
                </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous">
    </script>

    <script>
        // ============================================
        // KALMAN FILTER
        // ============================================
        class KalmanFilter {
            constructor(processNoise = 0.1, measurementNoise = 0.5, initialValue = 0) {
                this.processNoise = processNoise;
                this.measurementNoise = measurementNoise;
                this.estimate = initialValue;
                this.errorCovariance = 1;
                this.kalmanGain = 0;
            }

            update(measurement) {
                const predictedEstimate = this.estimate;
                const predictedErrorCovariance = this.errorCovariance + this.processNoise;
                this.kalmanGain = predictedErrorCovariance / (predictedErrorCovariance + this.measurementNoise);
                this.estimate = predictedEstimate + this.kalmanGain * (measurement - predictedEstimate);
                this.errorCovariance = (1 - this.kalmanGain) * predictedErrorCovariance;
                return this.estimate;
            }

            reset(value) {
                this.estimate = value;
                this.errorCovariance = 1;
                this.kalmanGain = 0;
            }
        }

        class PositionFilter {
            constructor() {
                this.x = new KalmanFilter(0.1, 0.3, 0);
                this.y = new KalmanFilter(0.1, 0.3, 0);
                this.hasLast = false;
            }

            update(rawX, rawY) {
                if (!this.hasLast) {
                    this.x.reset(rawX);
                    this.y.reset(rawY);
                    this.hasLast = true;
                    return { x: rawX, y: rawY };
                }
                return {
                    x: this.x.update(rawX),
                    y: this.y.update(rawY)
                };
            }

            reset() {
                this.hasLast = false;
                this.x.reset(0);
                this.y.reset(0);
            }
        }

        // ============================================
        // GLOBAL STATE
        // ============================================
        const state = {
            // Tracking
            isTracking: false,
            color: '#FF0000',
            brushSize: 5,
            shape: 'free',
            // Whiteboard
            points: [],
            history: [],
            redoStack: [],
            lastPoint: null,
            canvasWidth: 1200,
            canvasHeight: 700,
            // Hand
            isFist: false,
            handX: 0,
            handY: 0,
            isHandDetected: false,
            // Game
            gameRunning: false,
            gamePaused: false,
            gameScore: 0,
            gameHighScore: 0,
            // Mode
            mode: 'whiteboard' // 'whiteboard' | 'game'
        };

        // ============================================
        // DOM REFERENCES
        // ============================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const landmarkCanvas = document.getElementById('landmarkCanvas');
        const status = document.getElementById('status');

        const colorPicker = document.getElementById('colorPicker');
        const brushSizeInput = document.getElementById('brushSize');
        const sizeLabel = document.getElementById('sizeLabel');
        const colorHex = document.getElementById('colorHex');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        const shapeBtns = document.querySelectorAll('.shape-btn');
        const modeWhiteboard = document.getElementById('modeWhiteboard');
        const modeGame = document.getElementById('modeGame');
        const whiteboardSection = document.getElementById('whiteboardSection');
        const gameSection = document.getElementById('gameSection');

        // Game
        const gameCanvas = document.getElementById('gameCanvas');
        const gCtx = gameCanvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const gameOverlay = document.getElementById('gameOverlay');
        const gameOverlayTitle = document.getElementById('gameOverlayTitle');
        const gameOverlaySub = document.getElementById('gameOverlaySub');
        const gameStartBtn = document.getElementById('gameStartBtn');
        const gameStartBtn2 = document.getElementById('gameStartBtn2');
        const gamePauseBtn = document.getElementById('gamePauseBtn');
        const gameResetBtn = document.getElementById('gameResetBtn');

        let cameraInstance = null;
        let handsInstance = null;
        let positionFilter = new PositionFilter();

        // ============================================
        // WHITEBOARD FUNCTIONS
        // ============================================
        function initCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, state.canvasWidth, state.canvasHeight);
            saveState();
        }

        function drawLine(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = state.color;
            ctx.lineWidth = state.brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function drawShape(points) {
            if (points.length < 2) return;
            ctx.strokeStyle = state.color;
            ctx.lineWidth = state.brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            if (state.shape === 'free') {
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();
            } else if (state.shape === 'line') {
                ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                ctx.stroke();
            } else if (state.shape === 'rect') {
                const p1 = points[0];
                const p2 = points[points.length - 1];
                ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
            } else if (state.shape === 'circle') {
                const p1 = points[0];
                const p2 = points[points.length - 1];
                const r = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                ctx.arc(p1.x, p1.y, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function saveState() {
            const data = canvas.toDataURL();
            state.history.push(data);
            state.redoStack = [];
            if (state.history.length > 100) state.history.shift();
        }

        function undo() {
            if (state.history.length > 1) {
                state.redoStack.push(state.history.pop());
                restoreCanvas(state.history[state.history.length - 1]);
            }
        }

        function redo() {
            if (state.redoStack.length > 0) {
                const data = state.redoStack.pop();
                state.history.push(data);
                restoreCanvas(data);
            }
        }

        function restoreCanvas(data) {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, state.canvasWidth, state.canvasHeight);
                ctx.drawImage(img, 0, 0);
            };
            img.src = data;
        }

        function clearCanvas() {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, state.canvasWidth, state.canvasHeight);
            state.points = [];
            state.lastPoint = null;
            positionFilter.reset();
            saveState();
        }

        // ============================================
        // GAME - SUBWAY SURFERS CLONE
        // ============================================
        const game = {
            player: { x: 400, y: 480, width: 40, height: 60, lane: 1, jumping: false, rolling: false, jumpY: 0,
            jumpSpeed: 0 },
            lanes: [280, 400, 520],
            obstacles: [],
            coins: [],
            speed: 5,
            score: 0,
            highScore: 0,
            gameOver: false,
            paused: false,
            frameCount: 0,
            spawnRate: 30,
            coinSpawnRate: 20,
            playerColor: '#f44336',
            groundY: 540
        };

        function initGame() {
            game.obstacles = [];
            game.coins = [];
            game.score = 0;
            game.speed = 5;
            game.gameOver = false;
            game.paused = false;
            game.frameCount = 0;
            game.player.lane = 1;
            game.player.jumping = false;
            game.player.rolling = false;
            game.player.jumpY = 0;
            game.player.x = game.lanes[1];
            game.player.y = 480;
            gameOverlay.classList.remove('show');
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            scoreDisplay.textContent = Math.floor(game.score);
            if (game.score > game.highScore) {
                game.highScore = game.score;
                highScoreDisplay.textContent = Math.floor(game.highScore);
            }
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const type = Math.random() > 0.6 ? 'crate' : 'barrier';
            game.obstacles.push({
                x: 850,
                y: game.groundY - (type === 'crate' ? 40 : 50),
                width: 40,
                height: type === 'crate' ? 40 : 50,
                lane: lane,
                type: type,
                color: type === 'crate' ? '#8B6914' : '#DC143C'
            });
        }

        function spawnCoin() {
            const lane = Math.floor(Math.random() * 3);
            game.coins.push({
                x: 850,
                y: game.groundY - 70 - Math.random() * 60,
                width: 20,
                height: 20,
                lane: lane,
                collected: false
            });
        }

        function updateGame() {
            if (game.gameOver || game.paused) return;

            game.frameCount++;
            game.score += 0.5;
            updateScoreDisplay();

            // Speed up gradually
            game.speed = 5 + Math.floor(game.score / 1000);

            // Spawn obstacles
            if (game.frameCount % Math.max(20, game.spawnRate - Math.floor(game.score / 500)) === 0) {
                spawnObstacle();
            }

            // Spawn coins
            if (game.frameCount % Math.max(15, game.coinSpawnRate - Math.floor(game.score / 300)) === 0) {
                spawnCoin();
            }

            // Player jump physics
            if (game.player.jumping) {
                game.player.jumpY += game.player.jumpSpeed;
                game.player.jumpSpeed += 0.6;
                game.player.y = 480 - game.player.jumpY;
                if (game.player.jumpY < 0) {
                    game.player.jumping = false;
                    game.player.jumpY = 0;
                    game.player.jumpSpeed = 0;
                    game.player.y = 480;
                }
            }

            // Player position
            game.player.x = game.lanes[game.player.lane];

            // Move obstacles
            for (let i = game.obstacles.length - 1; i >= 0; i--) {
                game.obstacles[i].x -= game.speed;
                if (game.obstacles[i].x < -50) {
                    game.obstacles.splice(i, 1);
                    continue;
                }

                // Collision with player
                const obs = game.obstacles[i];
                const px = game.player.x;
                const py = game.player.y;
                const pw = game.player.width;
                const ph = game.player.height;

                // Check if same lane
                if (Math.abs(obs.x - px) < 30) {
                    // Check collision (with rolling)
                    const playerHeight = game.player.rolling ? ph * 0.5 : ph;
                    const playerY = game.player.rolling ? py + ph * 0.5 : py;

                    if (obs.y + obs.height > playerY && obs.y < playerY + playerHeight) {
                        // Check if rolling under barrier
                        if (game.player.rolling && obs.type === 'barrier') {
                            // Roll under!
                        } else {
                            gameOver();
                            return;
                        }
                    }
                }
            }

            // Move coins
            for (let i = game.coins.length - 1; i >= 0; i--) {
                game.coins[i].x -= game.speed;
                if (game.coins[i].x < -30) {
                    game.coins.splice(i, 1);
                    continue;
                }

                // Collect coin
                const coin = game.coins[i];
                if (!coin.collected && Math.abs(coin.x - game.player.x) < 25 && Math.abs(coin.y - game.player.y) < 30) {
                    coin.collected = true;
                    game.score += 15;
                    updateScoreDisplay();
                    game.coins.splice(i, 1);
                }
            }

            // Increase difficulty
            if (game.frameCount % 100 === 0 && game.spawnRate > 10) {
                game.spawnRate--;
            }
        }

        function gameOver() {
            game.gameOver = true;
            gameOverlayTitle.textContent = '💀 GAME OVER';
            gameOverlaySub.textContent = `Score: ${Math.floor(game.score)}`;
            gameOverlay.classList.add('show');
            if (game.score > game.highScore) {
                game.highScore = game.score;
                highScoreDisplay.textContent = Math.floor(game.highScore);
            }
        }

        function drawGame() {
            gCtx.clearRect(0, 0, 800, 600);

            // Background - sky gradient
            const grad = gCtx.createLinearGradient(0, 0, 0, 600);
            grad.addColorStop(0, '#1a1a4e');
            grad.addColorStop(0.5, '#2a3a6e');
            grad.addColorStop(1, '#0a0a2e');
            gCtx.fillStyle = grad;
            gCtx.fillRect(0, 0, 800, 600);

            // Ground
            gCtx.fillStyle = '#2a2a4e';
            gCtx.fillRect(0, game.groundY, 800, 60);
            gCtx.fillStyle = '#3a3a6e';
            gCtx.fillRect(0, game.groundY, 800, 5);

            // Lanes
            for (let i = 0; i < 3; i++) {
                const x = game.lanes[i];
                gCtx.strokeStyle = 'rgba(255,255,255,0.1)';
                gCtx.lineWidth = 1;
                gCtx.setLineDash([10, 20]);
                gCtx.beginPath();
                gCtx.moveTo(x, game.groundY);
                gCtx.lineTo(x, 0);
                gCtx.stroke();
                gCtx.setLineDash([]);
            }

            // Draw coins
            for (const coin of game.coins) {
                gCtx.fillStyle = '#fbbf24';
                gCtx.shadowColor = '#fbbf24';
                gCtx.shadowBlur = 15;
                gCtx.beginPath();
                gCtx.arc(coin.x, coin.y, 12, 0, Math.PI * 2);
                gCtx.fill();
                gCtx.shadowBlur = 0;
                // Shine
                gCtx.fillStyle = 'rgba(255,255,255,0.3)';
                gCtx.beginPath();
                gCtx.arc(coin.x - 4, coin.y - 4, 4, 0, Math.PI * 2);
                gCtx.fill();
            }

            // Draw obstacles
            for (const obs of game.obstacles) {
                gCtx.fillStyle = obs.color;
                gCtx.shadowColor = obs.color;
                gCtx.shadowBlur = 10;
                if (obs.type === 'crate') {
                    gCtx.fillRect(obs.x - obs.width / 2, obs.y - obs.height, obs.width, obs.height);
                    gCtx.strokeStyle = '#6B4F14';
                    gCtx.lineWidth = 2;
                    gCtx.strokeRect(obs.x - obs.width / 2, obs.y - obs.height, obs.width, obs.height);
                    // X marks
                    gCtx.strokeStyle = '#4a3510';
                    gCtx.lineWidth = 1;
                    gCtx.beginPath();
                    gCtx.moveTo(obs.x - obs.width / 2, obs.y - obs.height);
                    gCtx.lineTo(obs.x + obs.width / 2, obs.y);
                    gCtx.moveTo(obs.x + obs.width / 2, obs.y - obs.height);
                    gCtx.lineTo(obs.x - obs.width / 2, obs.y);
                    gCtx.stroke();
                } else {
                    // Barrier - wider and lower
                    gCtx.fillRect(obs.x - 30, obs.y - obs.height + 10, 60, obs.height - 10);
                    gCtx.fillStyle = '#ff6b6b';
                    gCtx.fillRect(obs.x - 25, obs.y - obs.height + 15, 50, 5);
                    gCtx.fillRect(obs.x - 25, obs.y - 15, 50, 5);
                }
                gCtx.shadowBlur = 0;
            }

            // Player
            const px = game.player.x - game.player.width / 2;
            const py = game.player.rolling ? game.player.y + 20 : game.player.y;

            // Shadow
            gCtx.fillStyle = 'rgba(0,0,0,0.3)';
            gCtx.beginPath();
            gCtx.ellipse(game.player.x, game.groundY + 5, 25, 8, 0, 0, Math.PI * 2);
            gCtx.fill();

            // Body
            const bodyHeight = game.player.rolling ? 30 : 50;
            gCtx.fillStyle = game.playerColor;
            gCtx.shadowColor = game.playerColor;
            gCtx.shadowBlur = 15;
            // Body
            gCtx.fillRect(px + 5, py, 30, bodyHeight);
            // Head
            gCtx.shadowBlur = 10;
            gCtx.beginPath();
            gCtx.arc(game.player.x, py - 5, 18, 0, Math.PI * 2);
            gCtx.fill();
            // Cap
            gCtx.fillStyle = '#e74c3c';
            gCtx.shadowBlur = 0;
            gCtx.fillRect(game.player.x - 20, py - 20, 40, 8);
            gCtx.fillRect(game.player.x + 15, py - 25, 15, 12);

            // Eyes
            gCtx.fillStyle = 'white';
            gCtx.beginPath();
            gCtx.arc(game.player.x - 8, py - 10, 6, 0, Math.PI * 2);
            gCtx.fill();
            gCtx.beginPath();
            gCtx.arc(game.player.x + 8, py - 10, 6, 0, Math.PI * 2);
            gCtx.fill();
            gCtx.fillStyle = '#1a1a2e';
            gCtx.beginPath();
            gCtx.arc(game.player.x - 10, py - 8, 3, 0, Math.PI * 2);
            gCtx.fill();
            gCtx.beginPath();
            gCtx.arc(game.player.x + 6, py - 8, 3, 0, Math.PI * 2);
            gCtx.fill();

            // Rolling indicator
            if (game.player.rolling) {
                gCtx.fillStyle = 'rgba(255,255,255,0.3)';
                gCtx.fillRect(px, py + 10, 40, 10);
            }

            gCtx.shadowBlur = 0;

            // Ground line
            gCtx.strokeStyle = 'rgba(255,255,255,0.05)';
            gCtx.lineWidth = 2;
            gCtx.beginPath();
            gCtx.moveTo(0, game.groundY);
            gCtx.lineTo(800, game.groundY);
            gCtx.stroke();

            // Score on canvas
            gCtx.fillStyle = 'rgba(255,255,255,0.05)';
            gCtx.fillRect(10, 10, 120, 40);
            gCtx.fillStyle = 'white';
            gCtx.font = '16px Arial';
            gCtx.fillText(`🏃 ${Math.floor(game.score)}`, 20, 38);

            // Speed indicator
            gCtx.fillStyle = 'rgba(255,255,255,0.05)';
            gCtx.fillRect(680, 10, 110, 40);
            gCtx.fillStyle = '#888';
            gCtx.font = '12px Arial';
            gCtx.fillText(`Speed: ${Math.floor(game.speed)}`, 690, 38);

            // Paused overlay
            if (game.paused) {
                gCtx.fillStyle = 'rgba(0,0,0,0.5)';
                gCtx.fillRect(0, 0, 800, 600);
                gCtx.fillStyle = 'white';
                gCtx.font = '48px Arial';
                gCtx.textAlign = 'center';
                gCtx.fillText('⏸️ PAUSED', 400, 300);
                gCtx.textAlign = 'left';
            }
        }

        function gameLoop() {
            if (!state.gameRunning) {
                drawGame();
                return;
            }

            if (!game.gameOver && !game.paused) {
                updateGame();
            }
            drawGame();

            // Update status with game info
            if (state.isTracking && state.isHandDetected) {
                const gestureText = state.isFist ? '✊ Roll' :
                    state.handY < 0.3 ? '☝️ Jump' :
                    state.handX < 0.3 ? '👈 Left' :
                    state.handX > 0.7 ? '👉 Right' : '🏃 Run';
                status.innerHTML = `🎮 Game: ${gestureText} | Score: ${Math.floor(game.score)}`;
            }

            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // GAME CONTROLS
        // ============================================
        function startGame() {
            initGame();
            state.gameRunning = true;
            game.paused = false;
            gameOverlay.classList.remove('show');
            gameStartBtn.textContent = '🔄 Restart';
            gameStartBtn2.textContent = '▶️ Running';
            status.innerHTML = '🎮 Game started! Use hand gestures to play!';
        }

        function pauseGame() {
            game.paused = !game.paused;
            gamePauseBtn.textContent = game.paused ? '▶️ Resume' : '⏸️ Pause';
            status.innerHTML = game.paused ? '⏸️ Game Paused' : '▶️ Game Resumed';
        }

        function resetGame() {
            initGame();
            gameOverlayTitle.textContent = '🏃 SUBWAY SURFERS';
            gameOverlaySub.textContent = 'Use hand gestures to play!';
            gameOverlay.classList.add('show');
            gameStartBtn.textContent = '🎮 Start Game';
            gameStartBtn2.textContent = '▶️ Start';
            state.gameRunning = false;
            status.innerHTML = '🎮 Game reset. Click Start to play!';
        }

        function handleGameGesture(isFist, handX, handY) {
            if (!state.gameRunning || game.gameOver || game.paused) return;

            // Normalize hand positions (0-1)
            const x = handX;
            const y = handY;

            // Jump: hand up (y < 0.3) and not fist
            if (y < 0.3 && !isFist && !game.player.jumping) {
                game.player.jumping = true;
                game.player.jumpSpeed = -12;
                game.player.y = 480;
                game.player.jumpY = 0;
                status.innerHTML = '☝️ JUMP!';
                return;
            }

            // Roll: fist
            if (isFist) {
                game.player.rolling = true;
                status.innerHTML = '✊ ROLL!';
                // Auto-reset roll after a moment
                clearTimeout(game.rollTimeout);
                game.rollTimeout = setTimeout(() => {
                    game.player.rolling = false;
                }, 500);
                return;
            }

            // Left: hand left
            if (x < 0.3 && !isFist) {
                if (game.player.lane > 0) {
                    game.player.lane--;
                    status.innerHTML = '👈 Left';
                }
                return;
            }

            // Right: hand right
            if (x > 0.7 && !isFist) {
                if (game.player.lane < 2) {
                    game.player.lane++;
                    status.innerHTML = '👉 Right';
                }
                return;
            }

            // Default: running
            if (!isFist && y >= 0.3 && x >= 0.3 && x <= 0.7) {
                game.player.rolling = false;
                status.innerHTML = '🏃 Running';
            }
        }

        // ============================================
        // HAND TRACKING WITH GESTURE RECOGNITION
        // ============================================
        function onResults(results) {
            if (!state.isTracking) return;

            const canvasElement = landmarkCanvas;
            canvasElement.width = video.videoWidth || 640;
            canvasElement.height = video.videoHeight || 480;
            const canvasCtx = canvasElement.getContext('2d');

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                state.isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                // Draw landmarks
                const drawingUtils = window;
                drawingUtils.drawConnectors(canvasCtx, landmarks,
                    drawingUtils.HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
                drawingUtils.drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', lineWidth: 1 });

                // Get index finger tip
                const indexTip = landmarks[8];
                const rawX = indexTip.x * canvasElement.width;
                const rawY = indexTip.y * canvasElement.height;

                // Apply Kalman filter
                const filtered = positionFilter.update(rawX, rawY);

                // Normalize coordinates (0-1)
                state.handX = filtered.x / canvasElement.width;
                state.handY = filtered.y / canvasElement.height;

                // Map to canvas for whiteboard
                const canvasX = (filtered.x / canvasElement.width) * state.canvasWidth;
                const canvasY = (filtered.y / canvasElement.height) * state.canvasHeight;

                // Check if fist
                const tips = [8, 12, 16, 20];
                const joints = [6, 10, 14, 18];
                let folded = 0;
                for (let i = 0; i < tips.length; i++) {
                    if (landmarks[tips[i]].y > landmarks[joints[i]].y) {
                        folded++;
                    }
                }
                state.isFist = folded >= 3;

                // ===== GAME MODE =====
                if (state.mode === 'game') {
                    handleGameGesture(state.isFist, state.handX, state.handY);
                }

                // ===== WHITEBOARD MODE =====
                if (state.mode === 'whiteboard') {
                    if (state.isFist) {
                        status.className = 'status status-paused';
                        status.innerHTML = '✊ Fist detected - Drawing paused';
                        state.lastPoint = null;
                    } else {
                        status.className = 'status status-drawing';
                        status.innerHTML = '☝️ Drawing mode - Move your finger!';

                        const currentPoint = { x: canvasX, y: canvasY };

                        if (state.lastPoint) {
                            if (state.shape === 'free') {
                                drawLine(state.lastPoint.x, state.lastPoint.y, currentPoint.x, currentPoint.y);
                            } else {
                                state.points.push(currentPoint);
                                drawShape(state.points);
                            }
                            if (state.history.length % 10 === 0) saveState();
                        } else {
                            state.points = [currentPoint];
                            saveState();
                        }

                        state.lastPoint = currentPoint;
                    }
                }

                // Draw finger tip circle on camera feed
                canvasCtx.beginPath();
                canvasCtx.arc(rawX, rawY, 10, 0, 2 * Math.PI);
                canvasCtx.fillStyle = state.isFist ? '#FF0000' : '#00FF00';
                canvasCtx.fill();

                // Show mode
                canvasCtx.fillStyle = 'rgba(0,0,0,0.5)';
                canvasCtx.fillRect(10, 10, 180, 25);
                canvasCtx.fillStyle = 'white';
                canvasCtx.font = '14px Arial';
                canvasCtx.fillText(`⚡ ${state.mode.toUpperCase()}`, 20, 28);

                canvasElement.style.display = 'block';
                video.style.display = 'none';

            } else {
                state.isHandDetected = false;
                status.className = 'status status-idle';
                status.innerHTML = state.mode === 'game' ?
                    '👋 No hand detected - Show your hand to play!' :
                    '👋 No hand detected - Show your hand';
                state.lastPoint = null;
                positionFilter.reset();
                canvasElement.style.display = 'none';
                video.style.display = 'block';
            }
        }

        // ============================================
        // CAMERA SETUP
        // ============================================
        async function startTracking() {
            try {
                state.isTracking = true;
                status.className = 'status status-tracking';
                status.innerHTML = '🔄 Starting camera... <span class="loading"></span>';
                startBtn.disabled = true;
                stopBtn.disabled = false;

                positionFilter.reset();

                if (typeof Hands === 'undefined') {
                    throw new Error('MediaPipe library not loaded.');
                }

                handsInstance = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
                    }
                });

                handsInstance.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.5
                });

                handsInstance.onResults(onResults);

                cameraInstance = new Camera(video, {
                    onFrame: async () => {
                        try {
                            await handsInstance.send({ image: video });
                        } catch (err) {}
                    },
                    width: 640,
                    height: 480,
                    facingMode: 'user'
                });

                await cameraInstance.start();

                status.className = 'status status-drawing';
                status.innerHTML = state.mode === 'game' ?
                    '🎮 Game mode - Use hand gestures to play!' :
                    '☝️ Show your hand and start drawing!';

            } catch (err) {
                console.error('Camera error:', err);
                status.className = 'status status-error';
                status.innerHTML = '❌ Error: ' + err.message;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                state.isTracking = false;
            }
        }

        function stopTracking() {
            state.isTracking = false;
            state.lastPoint = null;
            state.points = [];
            positionFilter.reset();

            if (cameraInstance) {
                try { cameraInstance.stop(); } catch (err) {}
                cameraInstance = null;
            }
            if (handsInstance) {
                try { handsInstance.close(); } catch (err) {}
                handsInstance = null;
            }

            status.className = 'status status-idle';
            status.innerHTML = '⏹️ Tracking stopped';
            video.style.display = 'none';
            landmarkCanvas.style.display = 'none';
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        // ============================================
        // MODE SWITCHING
        // ============================================
        function switchMode(mode) {
            state.mode = mode;
            if (mode === 'whiteboard') {
                whiteboardSection.classList.remove('hidden');
                gameSection.classList.remove('active');
                modeWhiteboard.classList.add('active');
                modeGame.classList.remove('active');
                status.innerHTML = '✏️ Whiteboard mode - Draw with your finger!';
                // Stop game
                state.gameRunning = false;
                game.paused = true;
            } else {
                whiteboardSection.classList.add('hidden');
                gameSection.classList.add('active');
                modeGame.classList.add('active');
                modeWhiteboard.classList.remove('active');
                status.innerHTML = '🎮 Game mode - Use hand gestures to play!';
                // Reset game state
                if (!state.gameRunning) {
                    resetGame();
                }
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        // Mode switching
        modeWhiteboard.addEventListener('click', () => switchMode('whiteboard'));
        modeGame.addEventListener('click', () => switchMode('game'));

        // Camera
        startBtn.addEventListener('click', startTracking);
        stopBtn.addEventListener('click', stopTracking);

        // Whiteboard
        clearBtn.addEventListener('click', () => {
            clearCanvas();
            state.points = [];
            state.lastPoint = null;
            positionFilter.reset();
        });

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `whiteboard_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        colorPicker.addEventListener('input', (e) => {
            state.color = e.target.value;
            colorHex.textContent = state.color;
        });

        brushSizeInput.addEventListener('input', (e) => {
            state.brushSize = parseInt(e.target.value);
            sizeLabel.textContent = state.brushSize;
        });

        shapeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                shapeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.shape = btn.dataset.shape;
                state.points = [];
                state.lastPoint = null;
            });
        });

        // Game controls
        gameStartBtn.addEventListener('click', startGame);
        gameStartBtn2.addEventListener('click', startGame);
        gamePauseBtn.addEventListener('click', pauseGame);
        gameResetBtn.addEventListener('click', resetGame);

        // Keyboard controls for game (fallback)
        document.addEventListener('keydown', (e) => {
            if (state.mode !== 'game' || !state.gameRunning) return;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    if (!game.player.jumping) {
                        game.player.jumping = true;
                        game.player.jumpSpeed = -12;
                        game.player.y = 480;
                        game.player.jumpY = 0;
                    }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                    game.player.rolling = true;
                    setTimeout(() => { game.player.rolling = false; }, 500);
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                    if (game.player.lane > 0) game.player.lane--;
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                    if (game.player.lane < 2) game.player.lane++;
                    e.preventDefault();
                    break;
                case ' ':
                    pauseGame();
                    e.preventDefault();
                    break;
            }
        });

        // ============================================
        // MOUSE DRAWING (Fallback)
        // ============================================
        let isMouseDown = false;
        let savedImageData = null;

        canvas.addEventListener('mousedown', (e) => {
            if (state.isTracking || state.mode === 'game') return;
            isMouseDown = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            state.points = [{ x, y }];
            savedImageData = ctx.getImageData(0, 0, state.canvasWidth, state.canvasHeight);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown || state.isTracking || state.mode === 'game') return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            state.points.push({ x, y });

            if (state.shape === 'free') {
                drawLine(state.points[state.points.length - 2].x, state.points[state.points.length - 2].y, x, y);
            } else {
                ctx.putImageData(savedImageData, 0, 0);
                drawShape(state.points);
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (isMouseDown && !state.isTracking && state.mode !== 'game') {
                isMouseDown = false;
                if (state.points.length > 1) saveState();
                state.points = [];
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isMouseDown && !state.isTracking && state.mode !== 'game') {
                isMouseDown = false;
                if (state.points.length > 1) saveState();
                state.points = [];
            }
        });

        // ============================================
        // INIT
        // ============================================
        initCanvas();
        stopBtn.disabled = true;
        landmarkCanvas.style.display = 'none';
        gameOverlay.classList.add('show');

        // Start game loop
        state.gameRunning = false;
        gameLoop();

        console.log('🖐️ Hand Tracking Studio Ready!');
        console.log('🎮 Switch between Whiteboard and Subway Surfers!');

        window.addEventListener('beforeunload', () => {
            if (cameraInstance) {
                try { cameraInstance.stop(); } catch (err) {}
            }
            if (handsInstance) {
                try { handsInstance.close(); } catch (err) {}
            }
        });
    </script>
</body>
</html>
